# Issue 940 supplies a GameUI variant absent from the configured Steam depots.
# SHA-256 a07b97c42292aab1b12c791b3b6847e47da1c8bbb8d430c1900d2f60cd65db86.
# engine/vgui2 are shared HL8684 inputs required by the GameUI analysis DAG.
modules:
  - name: engine
    module_windows: hw.dll
    skills:
      - name: find-SV_AddLinksToPM_-decompiles
        expected_input:
          - SV_AddLinksToPM_.{platform}.yaml
        expected_output:
          - SV_CopyEdictToPhysent.{platform}.yaml
      - name: find-server-physent-owners
        expected_output:
          - SV_AddLinksToPM_.{platform}.yaml
          - NUM_FOR_EDICT.{platform}.yaml
      - name: find-CCDAudio-MP3
        expected_output:
          - CCDAudio__MP3_InitStream.{platform}.yaml
          - CCDAudio__MP3_SetVolume.{platform}.yaml
      - name: find-BaseUISurface_PaintTraverse
        expected_input:
          - ../gameui/ISurface_PaintTraverse.{platform}.yaml
          - BaseUISurface_vtable.{platform}.yaml
        expected_output:
          - BaseUISurface_PaintTraverse.{platform}.yaml
      - name: find-BaseUISurface_PaintTraverse-vfuncs
        expected_input:
          - BaseUISurface_PaintTraverse.{platform}.yaml
        expected_output:
          - vgui2_IPanel_IsVisible.{platform}.yaml
          - vgui2_IPanel_Render_SetPopupVisible.{platform}.yaml
          - vgui2_IPanel_PaintTraverse.{platform}.yaml
      - name: find-EngineSurface-vtables
        expected_output:
          - EngineSurface_vtable.{platform}.yaml
          - BaseUISurface_vtable.{platform}.yaml
    symbols:
      - name: SV_AddLinksToPM_
        category: func
        artifact: SV_AddLinksToPM_.{platform}.yaml
      - name: SV_CopyEdictToPhysent
        category: func
      - name: NUM_FOR_EDICT
        category: func
      - name: CCDAudio__MP3_InitStream
        category: func
        alias:
          - CCDAudio::MP3_InitStream(int, bool)
          - _ZN8CCDAudio14MP3_InitStreamEib
      - name: CCDAudio__MP3_SetVolume
        category: func
        alias:
          - CCDAudio::MP3_SetVolume(float)
          - _ZN8CCDAudio13MP3_SetVolumeEf
      - name: BaseUISurface_PaintTraverse
        category: vfunc
      - name: vgui2_IPanel_IsVisible
        category: vfunc
      - name: vgui2_IPanel_Render_SetPopupVisible
