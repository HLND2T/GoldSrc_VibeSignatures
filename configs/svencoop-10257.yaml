    path_windows: Sven-Coop-10257/hw.dll
    path_linux: Sven-Coop-10257/hw.so
    skills:
      - name: find-R_RenderView
        expected_output:
          - R_RenderView.{platform}.yaml
      - name: find-SV_SendServerinfo-svencoop
        expected_output:
          - SV_SendServerinfo.{platform}.yaml
