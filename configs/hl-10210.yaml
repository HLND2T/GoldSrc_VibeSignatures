modules:
  - name: engine
    module_windows: hw.dll
    module_linux: hw.so
    path_windows: Half-Life-10210/hw.dll
    path_linux: Half-Life-10210/hw.so
    skills:
      - name: find-R_RenderView
        expected_output:
          - R_RenderView.{platform}.yaml
      - name: find-SV_SendServerinfo
        expected_output:
          - SV_SendServerinfo.{platform}.yaml
      - name: find-build_number
        expected_output:
          - build_number.{platform}.yaml
        expected_input:
          - SV_SendServerinfo.{platform}.yaml
      - name: find-Sys_Error
        expected_output:
          - Sys_Error.{platform}.yaml
      - name: find-ClientDLL_Init
        expected_output:
          - ClientDLL_Init.{platform}.yaml
      - name: find-ClientDLL_HudInit
        expected_output:
          - ClientDLL_HudInit.{platform}.yaml
      - name: find-CBaseUI__Initialize
        expected_output:
          - CBaseUI__Initialize.{platform}.yaml
      - name: find-ClientDLL_HudInit-decompiles
        expected_input:
          - ClientDLL_Init.{platform}.yaml
        expected_output:
          - g_ppEngfuncs.{platform}.yaml
          - g_ppExportFuncs.{platform}.yaml
      - name: find-g_phClientModule
        expected_input:
          - ClientDLL_HudInit.{platform}.yaml
        expected_output:
          - g_phClientModule.{platform}.yaml
      - name: find-g_pClientFactory
        expected_input:
          - CBaseUI__Initialize.{platform}.yaml
        expected_output:
          - g_pClientFactory.{platform}.yaml
      - name: find-DispatchDirectUserMsg
        expected_output:
          - DispatchDirectUserMsg.{platform}.yaml
      - name: find-Cvar_DirectSet
        expected_output:
          - Cvar_DirectSet.{platform}.yaml
      - name: find-LoadBlobFile_Caller
        expected_output:
          - LoadBlobFile_Caller.{platform}.yaml
      - name: find-LoadBlobFile
        expected_input:
          - LoadBlobFile_Caller.{platform}.yaml
        expected_output:
          - LoadBlobFile.{platform}.yaml
      - name: find-FreeBlob
        expected_input:
          - ClientDLL_Init.{platform}.yaml
        expected_output:
          - FreeBlob.{platform}.yaml
    symbols:
      - name: R_RenderView
        category: func
      - name: SV_SendServerinfo
        category: func
      - name: build_number
        category: func
      - name: Sys_Error
        category: func
      - name: ClientDLL_Init
        category: func
      - name: ClientDLL_HudInit
        category: func
      - name: CBaseUI__Initialize
        category: func
      - name: g_ppEngfuncs
        category: gv
      - name: g_ppExportFuncs
        category: gv
      - name: g_phClientModule
        category: gv
      - name: g_pClientFactory
        category: gv
      - name: DispatchDirectUserMsg
        category: func
      - name: Cvar_DirectSet
        category: func
      - name: LoadBlobFile_Caller
        category: func
      - name: LoadBlobFile
        category: func
      - name: FreeBlob
        category: func
  - name: client
    module_windows: client.dll
    module_linux: client.so
    path_windows: Half-Life-10210/valve/cl_dlls/client.dll
    path_linux: Half-Life-10210/valve/cl_dlls/client.so
