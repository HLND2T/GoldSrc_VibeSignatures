modules:
  - name: client
    module_windows: client.dll
    alias_windows:
      - client_orig.dll
      - client_original.dll
      - client_org.dll
    module_linux: client.so
    depot_windows: zp/cl_dlls/client.dll
    depot_linux: zp/cl_dlls/client.so
    skills:
      - name: find-CL_IsThirdPerson-decompiles
        expected_input:
          - CL_IsThirdPerson.{platform}.yaml
        expected_output:
          - g_iUser1.{platform}.yaml
          - g_iUser2.{platform}.yaml
      - name: find-client-private-predecessors
        expected_output:
          - CL_IsThirdPerson.{platform}.yaml
          - HUD_GetStudioModelInterface.{platform}.yaml
      - name: find-client-studio-interface
        expected_input:
          - HUD_GetStudioModelInterface.{platform}.yaml
        expected_output:
          - GameStudioRenderer_vtable.{platform}.yaml
          - GameStudioRenderer_StudioDrawModel.{platform}.yaml
      - name: find-GameStudioRenderer_StudioDrawModel-decompiles
        expected_input:
          - GameStudioRenderer_StudioDrawModel.{platform}.yaml
          - GameStudioRenderer_vtable.{platform}.yaml
        expected_output:
          - GameStudioRenderer_StudioDrawPlayer.{platform}.yaml
          - GameStudioRenderer_StudioSetupBones.{platform}.yaml
          - GameStudioRenderer_StudioSaveBones.{platform}.yaml
          - GameStudioRenderer_StudioMergeBones.{platform}.yaml
          - GameStudioRenderer_StudioRenderModel.{platform}.yaml
      - name: find-GameStudioRenderer_StudioRenderModel-decompiles
        expected_input:
          - GameStudioRenderer_StudioRenderModel.{platform}.yaml
          - GameStudioRenderer_vtable.{platform}.yaml
        expected_output:
          - GameStudioRenderer_StudioRenderFinal.{platform}.yaml
    symbols:
      - name: g_iUser1
        category: gv
      - name: g_iUser2
        category: gv
      - name: CL_IsThirdPerson
        category: func
      - name: HUD_GetStudioModelInterface
        category: func
      - name: GameStudioRenderer_vtable
        category: vtable
      - name: GameStudioRenderer_StudioDrawModel
        category: vfunc
      - name: GameStudioRenderer_StudioDrawPlayer
        category: vfunc
      - name: GameStudioRenderer_StudioSetupBones
        category: vfunc
      - name: GameStudioRenderer_StudioSaveBones
        category: vfunc
      - name: GameStudioRenderer_StudioMergeBones
        category: vfunc
      - name: GameStudioRenderer_StudioRenderModel
        category: vfunc
      - name: GameStudioRenderer_StudioRenderFinal
        category: vfunc
