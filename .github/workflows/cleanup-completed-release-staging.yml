name: Cleanup Completed Release Staging
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (optional; omit to sweep all completed)
        required: false
        type: string
      build_id:
        description: Build ID (optional; must be supplied with version)
        required: false
        type: string
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  cleanup:
    environment: win64
    runs-on: [self-hosted, windows, x64]
    env:
      PERSISTED_WORKSPACE: ${{ secrets.GSVIBE_PERSISTED_WORKSPACE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Cleanup completed staging records
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          $stagingRoot = "$env:PERSISTED_WORKSPACE\release-staging"
          $version = "${{ inputs.version }}"
          $buildId = "${{ inputs.build_id }}"
          if ([string]::IsNullOrWhiteSpace($version) -and -not [string]::IsNullOrWhiteSpace($buildId)) {
            throw "build_id requires version"
          }
          $records = @()
          if (-not [string]::IsNullOrWhiteSpace($version)) {
            $records = @(, @{ version = $version; build_id = $buildId })
          } else {
            $output = uv run python release_workflow.py list-completed --staging-root $stagingRoot
            $records = @($output | ConvertFrom-Json)
          }
          foreach ($record in $records) {
            uv run python release_workflow.py cleanup-completed `
              --staging-root $stagingRoot --persisted-root "$env:PERSISTED_WORKSPACE" `
              --version $record.version --build-id $record.build_id
            if ($LASTEXITCODE -ne 0) { throw "cleanup-completed failed for $($record.version)/$($record.build_id)" }
          }
