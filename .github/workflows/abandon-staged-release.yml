name: Abandon Staged Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. v20260825a)
        required: true
        type: string
      build_id:
        description: Build ID (run_id-run_attempt)
        required: true
        type: string
      pr_number:
        description: Output pull request number
        required: true
        type: number
      confirmation:
        description: Exact confirmation string (ABANDON <version>/<build_id>)
        required: true
        type: string
      reason:
        description: One-line abandon reason
        required: true
        type: string
permissions:
  contents: read
jobs:
  abandon:
    environment: win64
    runs-on: [self-hosted, windows, x64]
    env:
      PERSISTED_WORKSPACE: ${{ secrets.GSVIBE_PERSISTED_WORKSPACE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Resolve output branch and PR head
        id: resolve
        shell: pwsh
        run: |
          $pr = gh pr view ${{ inputs.pr_number }} --json headRefName,headRefOid --jq '{branch: .headRefName, sha: .headRefOid}'
          $branch = (gh pr view ${{ inputs.pr_number }} --json headRefName --jq .headRefName)
          $sha = (gh pr view ${{ inputs.pr_number }} --json headRefOid --jq .headRefOid)
          "PR_HEAD_SHA=$sha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OUTPUT_BRANCH=$branch" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Abandon pending build
        shell: pwsh
        run: |-
          uv run python release_workflow.py abandon-pending `
            --staging-root "$env:PERSISTED_WORKSPACE\release-staging" `
            --persisted-root "$env:PERSISTED_WORKSPACE" `
            --repository "${{ github.repository }}" `
            --output-branch "$env:OUTPUT_BRANCH" `
            --version "${{ inputs.version }}" --build-id "${{ inputs.build_id }}" `
            --pr-number "${{ inputs.pr_number }}" --event-head-sha "$env:PR_HEAD_SHA" `
            --confirmation "${{ inputs.confirmation }}" --reason "${{ inputs.reason }}"
          if ($LASTEXITCODE -ne 0) { throw 'abandon-pending failed' }
