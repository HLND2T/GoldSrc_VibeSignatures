name: Promote Release After Output Merge
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
jobs:
  resolve:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'gamesymbols/build/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release version from branch
        id: resolve
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          version="${HEAD_REF#gamesymbols/build/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  verify:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      build_id: ${{ steps.verify.outputs.build_id }}
      stage_dir: ${{ steps.verify.outputs.stage_dir }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify promotion
        id: verify
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STAGING_ROOT: ${{ secrets.PERSISTED_WORKSPACE }}
        run: |
          uv run python release_workflow.py verify-promotion \
            --repo-root "$GITHUB_WORKSPACE" \
            --staging-root "$STAGING_ROOT/release-staging" \
            --repository "${{ github.repository }}" \
            --head-repository "${{ github.event.pull_request.head.repo.full_name }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --pr-number "$PR_NUMBER" \
            --event-head-sha "$EVENT_HEAD_SHA" \
            --merge-sha "$MERGE_SHA" \
            --github-output "$GITHUB_OUTPUT"
  promote:
    needs: [resolve, verify]
    environment: win64
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 180
    env:
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Reconstruct workspace binaries
        shell: pwsh
        run: |
          uv run python release_workflow.py reconstruct --repo-root "$env:GITHUB_WORKSPACE" --stage-dir "${{ needs.verify.outputs.stage_dir }}" --version "${{ needs.resolve.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw 'reconstruct failed' }
      - name: Create release archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.resolve.outputs.version }}"
          $gamevers = uv run python -c "import yaml; print('\n'.join((yaml.safe_load(open('configs/config.yaml', encoding='utf-8')) or {}).get('gamevers', [])))"
          $archiveDir = Join-Path $env:RUNNER_TEMP "archives"
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null
          foreach ($gamever in ($gamevers -split "`n")) {
            & 7z a (Join-Path $archiveDir "gamedata-$gamever.7z") "configs/$gamever.yaml" "bin/$gamever" "gamesymbols/$gamever.yaml" "gamesymbols/$gamever.metadata.yaml" "gamedata/$gamever" -xr!*.i64 -xr!*.idb -xr!*.id0 -xr!*.id1 -xr!*.id2 -xr!*.nam -xr!*.til
            if ($LASTEXITCODE -ne 0) { throw "archive failed for $gamever" }
            & 7z a (Join-Path $archiveDir "gamebin-$gamever.7z") (Join-Path "bin" $gamever) -xr!*.i64 -xr!*.idb -xr!*.id0 -xr!*.id1 -xr!*.id2 -xr!*.nam -xr!*.til
            if ($LASTEXITCODE -ne 0) { throw "gamebin archive failed for $gamever" }
          }
          "ARCHIVE_DIR=$archiveDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Promote accepted binaries
        shell: pwsh
        run: |
          uv run python release_workflow.py promote-bin --persisted-root "$env:PERSISTED_WORKSPACE" --stage-dir "${{ needs.verify.outputs.stage_dir }}" --version "${{ needs.resolve.outputs.version }}" --build-id "${{ needs.verify.outputs.build_id }}"
          if ($LASTEXITCODE -ne 0) { throw 'promote-bin failed' }
      - name: Tag release
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          if (-not (git tag -l $version)) {
            git tag $version "${{ github.event.pull_request.merge_commit_sha }}"
            git push origin "refs/tags/$version"
          }
      - name: Write release metadata
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.resolve.outputs.version }}"
          $metadataDir = Join-Path $env:RUNNER_TEMP "release-metadata"
          New-Item -ItemType Directory -Path $metadataDir -Force | Out-Null
          $assets = Get-ChildItem -LiteralPath $env:ARCHIVE_DIR -File | ForEach-Object { $_.FullName }
          $assetArgs = @()
          foreach ($asset in $assets) { $assetArgs += @('--asset', $asset) }
          uv run python release_workflow.py write-release-metadata `
            --manifest (Join-Path $env:GITHUB_WORKSPACE "release-manifests/$version.json") `
            --output-dir $metadataDir --output-merge-sha "${{ github.event.pull_request.merge_commit_sha }}" `
            --tag-sha (git rev-parse "$version") --repository "${{ github.repository }}" @assetArgs
          if ($LASTEXITCODE -ne 0) { throw 'write-release-metadata failed' }
          $provenance = Join-Path $metadataDir "release-provenance-$version.json"
          "PROVENANCE=$provenance" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish GitHub release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.resolve.outputs.version }}"
          $metadataDir = Join-Path $env:RUNNER_TEMP "release-metadata"
          gh release create $version --title "GoldSrc game symbols $version" --notes-file (Join-Path $metadataDir "release-notes-$version.md") --draft
          foreach ($asset in (Get-ChildItem -LiteralPath $env:ARCHIVE_DIR -File)) {
            gh release upload $version $asset.FullName --clobber
          }
          gh release upload $version (Join-Path $metadataDir "release-provenance-$version.json") --clobber
          gh release upload $version (Join-Path $metadataDir "SHA256SUMS-$version.txt") --clobber
          gh release edit $version --draft=false
      - name: Finalize promotion
        shell: pwsh
        run: |-
          uv run python release_workflow.py finalize-promotion `
            --staging-root "$env:PERSISTED_WORKSPACE\release-staging" --pr-number "${{ github.event.pull_request.number }}" `
            --event-head-sha "${{ github.event.pull_request.head.sha }}" `
            --output-merge-sha "${{ github.event.pull_request.merge_commit_sha }}" `
            --release-provenance "$env:PROVENANCE"
          if ($LASTEXITCODE -ne 0) { throw 'finalize-promotion failed' }
