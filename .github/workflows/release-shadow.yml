name: Release provenance shadow
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-shadow.yml
      - configs/**
      - gamedata/**
      - gamesymbols/**
      - release_workflow.py
      - release_workflow_lib/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-shadow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Build and verify three release content identities
        run: >-
          uv run python release_workflow.py shadow
          -default-ref HEAD
          -repository-id "${{ github.repository_id }}"
          -workflow-repository "${{ github.repository }}"
          -workflow-path .github/workflows/release-shadow.yml
          -workflow-ref HEAD
          -tag hl-10210
          -tag hl-8684
          -tag svencoop-10257
          -output-dir .release-shadow
      - name: Upload read-only shadow evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-shadow-${{ github.sha }}
          path: .release-shadow/
          if-no-files-found: error
          retention-days: 30
