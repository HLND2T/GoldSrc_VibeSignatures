name: Game-symbol PR validation
on:
  pull_request:
    # Metadata-only edits (title/body) must not retrigger validation or cancel an
    # in-flight run, so `edited` is deliberately excluded.
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-gamesymbol-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_actions: ${{ steps.route.outputs.has_actions }}
      has_analysis: ${{ steps.route.outputs.has_analysis }}
      has_hosted: ${{ steps.route.outputs.has_hosted }}
      same_repository: ${{ steps.route.outputs.same_repository }}
      plan_sha256: ${{ steps.route.outputs.plan_sha256 }}
    steps:
      - name: Checkout PR merge commit with full history
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Checkout trusted base planner
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: .trusted-planner
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync trusted base planner environment
        run: uv sync --project .trusted-planner --locked
      - name: Fetch bin submodule trees without checkout
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bin_url=$(git config -f .trusted-planner/.gitmodules --get submodule.bin.url)
          base_bin=$(git ls-tree "$BASE_SHA" bin | awk '{print $3}')
          merge_bin=$(git ls-tree "$MERGE_SHA" bin | awk '{print $3}')
          git clone --filter=blob:none --no-checkout "$bin_url" "$RUNNER_TEMP/bin-objects"
          git -C "$RUNNER_TEMP/bin-objects" fetch --filter=blob:none origin "$base_bin" "$merge_bin"
      - name: Generate canonical bound plan from PR merge
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gamesymbol-validation"
          uv run --project .trusted-planner python .trusted-planner/gamesymbol_pr_validation.py plan \
            -repo-root "$GITHUB_WORKSPACE" \
            -base-ref "$BASE_SHA" \
            -head-ref "$HEAD_SHA" \
            -merge-ref "$MERGE_SHA" \
            -bin-repo "$RUNNER_TEMP/bin-objects" \
            -output "$RUNNER_TEMP/gamesymbol-validation/plan.json"
      - name: Route validation jobs
        id: route
        shell: bash
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/gamesymbol-validation/plan.json"
          has_actions=$(jq 'any(.tags[]; (.analysis_nodes | length) > 0 or .snapshot_rebuild or .gamedata_rebuild)' "$plan")
          has_analysis=$(jq 'any(.tags[]; (.analysis_nodes | length) > 0)' "$plan")
          has_hosted=$(jq 'any(.tags[]; (.analysis_nodes | length) == 0 and (.snapshot_rebuild or .gamedata_rebuild))' "$plan")
          echo "has_actions=$has_actions" >> "$GITHUB_OUTPUT"
          echo "has_analysis=$has_analysis" >> "$GITHUB_OUTPUT"
          echo "has_hosted=$has_hosted" >> "$GITHUB_OUTPUT"
          echo "same_repository=$SAME_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$(jq -r '.plan_sha256' "$plan")" >> "$GITHUB_OUTPUT"
          if [[ "$has_actions" != "true" ]]; then
            echo "no affected game-symbol actions"
          fi
      - name: Upload bound plan
        uses: actions/upload-artifact@v7
        with:
          # Failed-job reruns reuse the successful plan job from an earlier attempt.
          name: gamesymbol-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gamesymbol-validation/plan.json
          if-no-files-found: error
          overwrite: true
  validate-hosted:
    needs: plan
    if: needs.plan.outputs.has_hosted == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit and exact binaries
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout trusted base validator
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: .trusted-validator
      - name: Sync and update submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --force --depth 1 --jobs 8
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv sync --project .trusted-validator --locked
      - uses: actions/download-artifact@v7
        with:
          name: gamesymbol-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gamesymbol-validation
      - name: Validate snapshot and gamedata-only actions
        id: validate-artifacts
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/gamesymbol-validation/plan.json"
          artifact_root="$RUNNER_TEMP/rebuilt-bin-artifacts"
          while IFS= read -r tag; do
            uv run --project .trusted-validator python .trusted-validator/gamesymbol_pr_validation.py materialize \
              -repo-root "$GITHUB_WORKSPACE" -plan "$plan" -tag "$tag" -merge-ref HEAD -bindir bin \
              -artifactdir "$artifact_root"
            stage=$(mktemp -d)
            trap 'rm -rf "$stage"' EXIT
            uv run --project .trusted-validator python .trusted-validator/gamesymbol_pr_validation.py compare \
              -repo-root "$GITHUB_WORKSPACE" -plan "$plan" -tag "$tag" -merge-ref HEAD -bindir bin \
              -artifactdir "$artifact_root"
            uv run --project .trusted-validator python .trusted-validator/gamesymbol_candidate.py build \
              -gamever "$tag" -bindir bin -artifactdir "$artifact_root" -configyaml "configs/$tag.yaml" \
              -output "$stage/$tag.yaml" -session "$stage/symbol-session.json" -snapshot-schema-version 8
            uv run python gamesymbol_candidate.py guard -candidate "$stage/$tag.yaml" -session "$stage/symbol-session.json"
            uv run python gamedata_candidate.py build -gamever "$tag" -build-id "pr-${{ github.run_id }}" \
              -snapshot "$stage/$tag.yaml" -configyaml "configs/$tag.yaml" -modulesdir gamedata-generators \
              -candidate-root "$stage/gamedata" -session "$stage/gamedata-session.json"
            uv run python gamedata_candidate.py guard -session "$stage/gamedata-session.json"
            uv run python gamesymbol_candidate.py mark -candidate "$stage/$tag.yaml" -session "$stage/symbol-session.json" \
              -step gamedata -gamedata-session "$stage/gamedata-session.json"
            rm -rf "$stage"
            trap - EXIT
          done < <(jq -r '.tags[] | select((.analysis_nodes | length) == 0 and (.snapshot_rebuild or .gamedata_rebuild)) | .tag' "$plan")
      - name: Upload rebuilt artifacts on validation failure
        if: failure() && steps.validate-artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: gamesymbol-rebuilt-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          # Preserve tag/module paths; expected bytes are bound by the separately uploaded plan.
          path: ${{ runner.temp }}/rebuilt-bin-artifacts/**/*.yaml
          if-no-files-found: warn
  warmup-idb:
    needs: plan
    if: needs.plan.outputs.has_analysis == 'true' && needs.plan.outputs.same_repository == 'true'
    uses: ./.github/workflows/warmup-idb.yml
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
      scope: bound-plan
      plan_artifact_name: gamesymbol-plan-${{ github.run_id }}
      plan_sha256: ${{ needs.plan.outputs.plan_sha256 }}
      selection_artifact_name: idb-cache-selection-${{ github.run_id }}-${{ github.run_attempt }}
  analyze-self-hosted:
    needs: [plan, warmup-idb]
    # Analysis always requires a successful producer. The consumer never warms or rebuilds.
    if: |
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.has_analysis == 'true' && needs.plan.outputs.same_repository == 'true'
      && needs.warmup-idb.result == 'success'
    runs-on: [self-hosted, cross-platform]
    environment: win64
    timeout-minutes: 720
    env:
      CI_KIND: pr
      GSVIBE_AGENT: ${{ secrets.GSVIBE_AGENT }}
      GSVIBE_AGENT_MODEL: ${{ secrets.GSVIBE_AGENT_MODEL }}
      GSVIBE_LLM_APIKEY: ${{ secrets.GSVIBE_LLM_APIKEY }}
      GSVIBE_LLM_BASEURL: ${{ secrets.GSVIBE_LLM_BASEURL }}
      GSVIBE_LLM_EFFORT: ${{ secrets.GSVIBE_LLM_EFFORT }}
      GSVIBE_LLM_MODEL: ${{ secrets.GSVIBE_LLM_MODEL }}
      GSVIBE_LLM_TEMPERATURE: ${{ secrets.GSVIBE_LLM_TEMPERATURE || '0' }}
      GSVIBE_ANALYSIS_MAX_CONCURRENCY: ${{ vars.GSVIBE_ANALYSIS_MAX_CONCURRENCY || '1' }}
      GSVIBE_ANALYSIS_MAX_MEMORY_MIB: ${{ vars.GSVIBE_ANALYSIS_MAX_MEMORY_MIB }}
      GSVIBE_ANALYSIS_INITIAL_WORKER_RESERVATION_MIB: ${{ vars.GSVIBE_ANALYSIS_INITIAL_WORKER_RESERVATION_MIB }}
      GSVIBE_TAIL_MAX_CONCURRENCY: ${{ vars.GSVIBE_TAIL_MAX_CONCURRENCY || '2' }}
    steps:
      - name: Checkout PR merge commit and exact binaries
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - name: Checkout trusted base validator
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          path: .trusted-validator
      - uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35  # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-goldsrc-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - run: uv sync --locked
      - name: Checkout cache transport tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - name: Sync and update submodules
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: sync-submodules
      - run: uv sync --project .trusted-validator --locked
      - uses: actions/download-artifact@v7
        with:
          name: gamesymbol-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gamesymbol-validation
      - name: Clean persisted submodule analysis state
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: clean-bin
      - name: Resolve IDA interpreter identity
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: resolve-consumer-ida
      - name: Download exact warm IDB cache selection
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.warmup-idb.outputs.selection_artifact_name }}
          path: ${{ runner.temp }}/gamesymbol-validation
      - name: Prepare disposable S3 staging
        id: s3-layout
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Restore exact producer IDB snapshot
        uses: ./.ci-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ needs.warmup-idb.outputs.cache_key }}
          path: ${{ steps.s3-layout.outputs.cache-path }}
          required: 'true'
      - name: Verify and restore exact warm IDB cache generations
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: pr-restore
        env:
          PRODUCER_SELECTION_SHA256: ${{ needs.warmup-idb.outputs.selection_sha256 }}
      - name: Analyze selected nodes and build self-consistent candidates
        id: validate-artifacts
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: pr-validate
      - name: Upload rebuilt artifacts on validation failure
        if: failure() && steps.validate-artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: gamesymbol-rebuilt-self-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          # Preserve partial rebuilds too, without uploading binaries or IDA state.
          path: ${{ runner.temp }}/rebuilt-bin-artifacts/**/*.yaml
          if-no-files-found: warn
      - name: Upload analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamesymbol-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gamesymbol-analysis-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            ${{ runner.temp }}/gamesymbol-analysis-${{ github.run_id }}-${{ github.run_attempt }}/**/summary.json
          if-no-files-found: warn
      - name: Locate pr artifacts for S3
        id: s3-artifacts
        if: always() && steps.s3-layout.outcome == 'success'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: artifacts
      - name: Persist pr artifacts to S3
        if: always() && steps.s3-artifacts.outputs.available == 'true'
        uses: ./.ci-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.prefix }}-artifacts-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-artifacts.outputs.paths }}
      - name: Remove generated submodule analysis state
        if: always()
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: cleanup
  fork-analysis-blocked:
    needs: plan
    if: needs.plan.outputs.has_analysis == 'true' && needs.plan.outputs.same_repository != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fork PR analysis nodes require a trusted same-repository runner" && exit 1
  pr-validate:
    name: pr-validate
    needs: [plan, warmup-idb, validate-hosted, analyze-self-hosted, fork-analysis-blocked]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate source validation results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WARMUP_RESULT: ${{ needs.warmup-idb.result }}
          HOSTED_RESULT: ${{ needs.validate-hosted.result }}
          ANALYSIS_RESULT: ${{ needs.analyze-self-hosted.result }}
          FORK_RESULT: ${{ needs.fork-analysis-blocked.result }}
          HAS_ACTIONS: ${{ needs.plan.outputs.has_actions }}
          HAS_ANALYSIS: ${{ needs.plan.outputs.has_analysis }}
          HAS_HOSTED: ${{ needs.plan.outputs.has_hosted }}
          SAME_REPOSITORY: ${{ needs.plan.outputs.same_repository }}
        shell: bash
        run: |-
          set -euo pipefail
          failed=false
          require_result() {
            local job="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$job must be $expected, got $actual"
              failed=true
            fi
          }
          for flag in "$HAS_ACTIONS" "$HAS_ANALYSIS" "$HAS_HOSTED" "$SAME_REPOSITORY"; do
            if [[ "$flag" != "true" && "$flag" != "false" ]]; then
              echo "::error::planner emitted an invalid boolean output: $flag"
              failed=true
            fi
          done
          require_result "plan" "$PLAN_RESULT" "success"
          if [[ "$HAS_ANALYSIS" == "true" || "$HAS_HOSTED" == "true" ]]; then
            if [[ "$HAS_ACTIONS" != "true" ]]; then
              echo "::error::planner action outputs are inconsistent"
              failed=true
            fi
          fi
          if [[ "$HAS_HOSTED" == "true" ]]; then
            require_result "validate-hosted" "$HOSTED_RESULT" "success"
          else
            require_result "validate-hosted" "$HOSTED_RESULT" "skipped"
          fi
          if [[ "$HAS_ANALYSIS" == "true" && "$SAME_REPOSITORY" == "true" ]]; then
            require_result "analyze-self-hosted" "$ANALYSIS_RESULT" "success"
            require_result "warmup-idb" "$WARMUP_RESULT" "success"
          else
            require_result "analyze-self-hosted" "$ANALYSIS_RESULT" "skipped"
            require_result "warmup-idb" "$WARMUP_RESULT" "skipped"
          fi
          if [[ "$HAS_ANALYSIS" == "true" && "$SAME_REPOSITORY" != "true" ]]; then
            require_result "fork-analysis-blocked" "$FORK_RESULT" "failure"
            echo "::error::analysis nodes from a fork cannot use the self-hosted runner"
            failed=true
          else
            require_result "fork-analysis-blocked" "$FORK_RESULT" "skipped"
          fi
          [[ "$failed" == "false" ]]
