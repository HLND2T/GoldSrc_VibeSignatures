name: Game-symbol PR validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-gamesymbol-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  finalize:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Finish without persisted YAML promotion
        run: echo "No game-symbol staging or promotion is configured"
  classify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.classify.outputs.route }}
    steps:
      - name: Checkout trusted base classifier
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Classify pull request route
        id: classify
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! -f pull_request_route.py ]]; then
            echo "route=source" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          route=$(python - <<'PY'
          import os
          from pull_request_route import classify_pr_route
          print(classify_pr_route(head_ref=os.environ["HEAD_REF"], output_routing_enabled=True))
          PY
          )
          echo "route=$route" >> "$GITHUB_OUTPUT"
  plan:
    needs: classify
    if: github.event.action != 'closed' && needs.classify.outputs.route == 'source'
    runs-on: ubuntu-latest
    outputs:
      has_actions: ${{ steps.route.outputs.has_actions }}
      has_analysis: ${{ steps.route.outputs.has_analysis }}
      has_hosted: ${{ steps.route.outputs.has_hosted }}
      same_repository: ${{ steps.route.outputs.same_repository }}
      cache_mode: ${{ steps.route.outputs.cache_mode }}
    steps:
      - name: Checkout PR merge commit with full history
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync PR merge planner environment
        run: uv sync --locked
      - name: Fetch bin submodule trees without checkout
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bin_url=$(git config -f .gitmodules --get submodule.bin.url)
          base_bin=$(git ls-tree "$BASE_SHA" bin | awk '{print $3}')
          merge_bin=$(git ls-tree "$MERGE_SHA" bin | awk '{print $3}')
          git clone --filter=blob:none --no-checkout "$bin_url" "$RUNNER_TEMP/bin-objects"
          git -C "$RUNNER_TEMP/bin-objects" fetch --filter=blob:none origin "$base_bin" "$merge_bin"
      - name: Generate canonical bound plan from PR merge
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          CACHE_MODE: ${{ vars.GSVIBE_IDB_CACHE_MODE || 'cold' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gamesymbol-validation"
          uv run python gamesymbol_pr_validation.py plan \
            -repo-root "$GITHUB_WORKSPACE" \
            -base-ref "$BASE_SHA" \
            -head-ref "$HEAD_SHA" \
            -merge-ref "$MERGE_SHA" \
            -bin-repo "$RUNNER_TEMP/bin-objects" \
            -cache-mode "$CACHE_MODE" \
            -output "$RUNNER_TEMP/gamesymbol-validation/plan.json"
      - name: Route validation jobs
        id: route
        shell: bash
        env:
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/gamesymbol-validation/plan.json"
          has_actions=$(jq 'any(.tags[]; (.analysis_nodes | length) > 0 or .snapshot_rebuild or .gamedata_rebuild)' "$plan")
          has_analysis=$(jq 'any(.tags[]; (.analysis_nodes | length) > 0)' "$plan")
          has_hosted=$(jq 'any(.tags[]; (.analysis_nodes | length) == 0 and (.snapshot_rebuild or .gamedata_rebuild))' "$plan")
          echo "has_actions=$has_actions" >> "$GITHUB_OUTPUT"
          echo "has_analysis=$has_analysis" >> "$GITHUB_OUTPUT"
          echo "has_hosted=$has_hosted" >> "$GITHUB_OUTPUT"
          echo "same_repository=$SAME_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "cache_mode=$(jq -r '.cache_mode' "$plan")" >> "$GITHUB_OUTPUT"
          if [[ "$has_actions" != "true" ]]; then
            echo "no affected game-symbol actions"
          fi
      - name: Upload bound plan
        uses: actions/upload-artifact@v4
        with:
          # Failed-job reruns reuse the successful plan job from an earlier attempt.
          name: gamesymbol-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gamesymbol-validation/plan.json
          if-no-files-found: error
          overwrite: true
  validate-hosted:
    needs: [classify, plan]
    if: needs.classify.outputs.route == 'source' && needs.plan.outputs.has_hosted == 'true'
    runs-on: ubuntu-latest
    env:
      SUBMODULE_CACHE_VERSION: v1
    steps:
      - name: Checkout PR merge commit and exact binaries
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
      - name: Compute submodule cache key
        id: submodule-cache-key
        shell: bash
        run: |
          set -euo pipefail
          content="$(cat .gitmodules)"$'\n\n'"$(git ls-tree HEAD -- bin)"
          hash="$(printf '%s' "$content" | sha256sum | awk '{print $1}')"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore submodule cache
        id: restore-submodule-cache
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            bin
          key: ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-${{ steps.submodule-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-
      - name: Sync and update submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --force --depth 1 --jobs 8
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: gamesymbol-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gamesymbol-validation
      - name: Validate snapshot and gamedata-only actions
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/gamesymbol-validation/plan.json"
          while IFS= read -r tag; do
            uv run python gamesymbol_pr_validation.py materialize \
              -repo-root "$GITHUB_WORKSPACE" -plan "$plan" -tag "$tag" -merge-ref HEAD -bindir bin
            stage=$(mktemp -d)
            trap 'rm -rf "$stage"' EXIT
            uv run python gamesymbol_candidate.py build -gamever "$tag" -bindir bin -configyaml "configs/$tag.yaml" \
              -output "$stage/$tag.yaml" -session "$stage/symbol-session.json"
            uv run python gamesymbol_candidate.py guard -candidate "$stage/$tag.yaml" -session "$stage/symbol-session.json"
            uv run python gamedata_candidate.py build -gamever "$tag" -build-id "pr-${{ github.run_id }}" \
              -snapshot "$stage/$tag.yaml" -configyaml "configs/$tag.yaml" -modulesdir gamedata-generators \
              -candidate-root "$stage/gamedata" -session "$stage/gamedata-session.json"
            uv run python gamedata_candidate.py guard -session "$stage/gamedata-session.json"
            uv run python gamesymbol_candidate.py mark -candidate "$stage/$tag.yaml" -session "$stage/symbol-session.json" \
              -step gamedata -gamedata-session "$stage/gamedata-session.json"
            rm -rf "$stage"
            trap - EXIT
          done < <(jq -r '.tags[] | select((.analysis_nodes | length) == 0 and (.snapshot_rebuild or .gamedata_rebuild)) | .tag' "$plan")
  analyze-self-hosted:
    needs: [classify, plan]
    if: needs.classify.outputs.route == 'source' && needs.plan.outputs.has_analysis == 'true' && needs.plan.outputs.same_repository
      == 'true'
    runs-on: [self-hosted, windows, x64]
    environment: win64
    timeout-minutes: 720
    concurrency:
      group: ${{ github.repository }}-gamesymbol-self-hosted-ida
      cancel-in-progress: false
    env:
      GSVIBE_AGENT: ${{ secrets.GSVIBE_AGENT || 'claude' }}
      GSVIBE_AGENT_MODEL: ${{ secrets.GSVIBE_AGENT_MODEL }}
      GSVIBE_LLM_APIKEY: ${{ secrets.GSVIBE_LLM_APIKEY }}
      GSVIBE_LLM_BASEURL: ${{ secrets.GSVIBE_LLM_BASEURL }}
      GSVIBE_LLM_EFFORT: ${{ secrets.GSVIBE_LLM_EFFORT }}
      GSVIBE_LLM_MODEL: ${{ secrets.GSVIBE_LLM_MODEL || 'gpt-4o' }}
      GSVIBE_LLM_TEMPERATURE: ${{ secrets.GSVIBE_LLM_TEMPERATURE }}
      SUBMODULE_CACHE_VERSION: v1
    steps:
      - name: Checkout PR merge commit and exact binaries
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
      - name: Compute submodule cache key
        id: submodule-cache-key
        shell: pwsh
        run: |
          $content = @()
          $content += Get-Content -Raw .gitmodules
          $content += ""
          # Hash the committed bin gitlink SHA (not the working-tree submodule
          # state, which drifts between uninitialized and initialized) so the
          # key is deterministic and shared by runs pinning the same bin commit.
          $content += git ls-tree HEAD -- bin
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($content -join "`n"))
          $hash = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace("-", "").ToLowerInvariant()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore submodule cache
        id: restore-submodule-cache
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            bin
          key: ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-${{ steps.submodule-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-
      - name: Sync and update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed." }
          git submodule update --init --recursive --force --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed." }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Normalize canonical snapshot checkout bytes
        shell: pwsh
        run: |
          @'
          from gamesymbol_snapshot_lib.paths import iter_snapshot_paths
          for path in iter_snapshot_paths("gamesymbols"):
              raw = path.read_bytes()
              normalized = raw.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              if normalized != raw:
                  path.write_bytes(normalized)
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { throw 'snapshot checkout normalization failed' }
      - uses: actions/download-artifact@v4
        with:
          name: gamesymbol-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/gamesymbol-validation
      - name: Clean persisted submodule analysis state
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $binRoot = (Resolve-Path -LiteralPath (Join-Path $workspaceRoot 'bin')).Path
          if (-not $binRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "bin submodule escaped the checked-out workspace: $binRoot"
          }
          $gitTopLevel = (git -C $binRoot rev-parse --show-toplevel).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($gitTopLevel) -ne [IO.Path]::GetFullPath($binRoot)) {
            throw "Refusing to clean an unexpected bin repository: $gitTopLevel"
          }
          # reset --hard reverts tracked-file modifications restored from a dirty
          # cache before analysis; git clean handles the untracked side.
          git -C $binRoot reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset tracked bin files' }
          git -C $binRoot clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'failed to clean persisted bin analysis state' }
      - name: Prepare exact warm IDB cache selection
        if: needs.plan.outputs.cache_mode == 'warm'
        shell: pwsh
        env:
          PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
          GSVIBE_IDA_KERNEL_VERSION: ${{ vars.GSVIBE_IDA_KERNEL_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PERSISTED_WORKSPACE)) {
            throw 'PERSISTED_WORKSPACE is required for warm cache mode'
          }
          if ([string]::IsNullOrWhiteSpace($env:IDADIR) -or [string]::IsNullOrWhiteSpace($env:GSVIBE_IDA_KERNEL_VERSION)) {
            throw 'IDADIR and GSVIBE_IDA_KERNEL_VERSION are required for warm cache mode'
          }
          $bundle = Join-Path $env:RUNNER_TEMP 'gamesymbol-validation'
          $planPath = Join-Path $bundle 'plan.json'
          $selectionPath = Join-Path $bundle 'cache-selection.json'
          $selectionShaPath = Join-Path $bundle 'cache-selection.sha256'
          uv run python idb_cache_workflow.py prepare `
            -repo-root $env:GITHUB_WORKSPACE -plan $planPath -merge-ref HEAD -bindir bin `
            -persisted-root $env:PERSISTED_WORKSPACE -ida-root $env:IDADIR `
            -kernel-version $env:GSVIBE_IDA_KERNEL_VERSION -run-id "${{ github.run_id }}" `
            -attempt "${{ github.run_attempt }}" -output $selectionPath -output-sha256 $selectionShaPath
          if ($LASTEXITCODE -ne 0) { throw 'warm cache preparation failed' }
      - name: Verify exact warm IDB cache selection
        if: needs.plan.outputs.cache_mode == 'warm'
        shell: pwsh
        env:
          PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
          GSVIBE_IDA_KERNEL_VERSION: ${{ vars.GSVIBE_IDA_KERNEL_VERSION }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'gamesymbol-validation'
          uv run python idb_cache_workflow.py verify `
            -repo-root $env:GITHUB_WORKSPACE -plan (Join-Path $bundle 'plan.json') -merge-ref HEAD -bindir bin `
            -persisted-root $env:PERSISTED_WORKSPACE -ida-root $env:IDADIR `
            -kernel-version $env:GSVIBE_IDA_KERNEL_VERSION -selection (Join-Path $bundle 'cache-selection.json') `
            -selection-sha256 (Join-Path $bundle 'cache-selection.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'warm cache selection verification failed' }
      - name: Upload warm IDB cache selection evidence
        if: needs.plan.outputs.cache_mode == 'warm'
        uses: actions/upload-artifact@v4
        with:
          name: idb-cache-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gamesymbol-validation/cache-selection.json
            ${{ runner.temp }}/gamesymbol-validation/cache-selection.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Restore exact warm IDB cache generations
        if: needs.plan.outputs.cache_mode == 'warm'
        shell: pwsh
        env:
          PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
          GSVIBE_IDA_KERNEL_VERSION: ${{ vars.GSVIBE_IDA_KERNEL_VERSION }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'gamesymbol-validation'
          uv run python idb_cache_workflow.py restore `
            -repo-root $env:GITHUB_WORKSPACE -plan (Join-Path $bundle 'plan.json') -merge-ref HEAD -bindir bin `
            -persisted-root $env:PERSISTED_WORKSPACE -ida-root $env:IDADIR `
            -kernel-version $env:GSVIBE_IDA_KERNEL_VERSION -selection (Join-Path $bundle 'cache-selection.json') `
            -selection-sha256 (Join-Path $bundle 'cache-selection.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'warm cache restore failed' }
      - name: Analyze selected nodes and build self-consistent candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $planPath = Join-Path $env:RUNNER_TEMP 'gamesymbol-validation\plan.json'
          $plannerCli = Join-Path $env:GITHUB_WORKSPACE 'gamesymbol_pr_validation.py'
          $plan = Get-Content -Raw -LiteralPath $planPath | ConvertFrom-Json
          foreach ($action in $plan.tags) {
            if ($action.analysis_nodes.Count -eq 0) { continue }
            $tag = $action.tag
            uv run python $plannerCli materialize -repo-root $env:GITHUB_WORKSPACE -plan $planPath -tag $tag -merge-ref HEAD -bindir bin
            if ($LASTEXITCODE -ne 0) { throw "materialization failed for $tag" }
            $analyzerArgs = @('ida_analyze_bin.py', '-gamever', $tag, '-oldgamever', 'none', '-cache_mode', $plan.cache_mode)
            foreach ($node in $action.analysis_nodes) { $analyzerArgs += @('-node', $node) }
            uv run python @analyzerArgs
            if ($LASTEXITCODE -ne 0) { throw "selected-node analysis failed for $tag" }
            $stage = Join-Path $env:RUNNER_TEMP ("gamesymbol-$tag-" + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $stage | Out-Null
            try {
              $candidate = Join-Path $stage "$tag.yaml"
              $symbolSession = Join-Path $stage 'symbol-session.json'
              $gamedataSession = Join-Path $stage 'gamedata-session.json'
              uv run python gamesymbol_candidate.py build -gamever $tag -bindir bin -configyaml "configs/$tag.yaml" -output $candidate -session $symbolSession
              if ($LASTEXITCODE -ne 0) { throw "candidate build failed for $tag" }
              uv run python gamesymbol_candidate.py guard -candidate $candidate -session $symbolSession
              if ($LASTEXITCODE -ne 0) { throw "candidate guard failed for $tag" }
              uv run python gamedata_candidate.py build -gamever $tag -build-id "pr-${{ github.run_id }}" -snapshot $candidate `
                -configyaml "configs/$tag.yaml" -modulesdir gamedata-generators -candidate-root (Join-Path $stage 'gamedata') `
                -session $gamedataSession
              if ($LASTEXITCODE -ne 0) { throw "gamedata build failed for $tag" }
              uv run python gamedata_candidate.py guard -session $gamedataSession
              if ($LASTEXITCODE -ne 0) { throw "gamedata guard failed for $tag" }
              uv run python gamesymbol_candidate.py mark -candidate $candidate -session $symbolSession -step gamedata -gamedata-session $gamedataSession
              if ($LASTEXITCODE -ne 0) { throw "candidate self-consistency check failed for $tag" }
            } finally {
              if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
            }
          }
      - name: Remove generated submodule analysis state
        if: always()
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $binRoot = (Resolve-Path -LiteralPath (Join-Path $workspaceRoot 'bin')).Path
          if (-not $binRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "bin submodule escaped the checked-out workspace: $binRoot"
          }
          $gitTopLevel = (git -C $binRoot rev-parse --show-toplevel).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($gitTopLevel) -ne [IO.Path]::GetFullPath($binRoot)) {
            throw "Refusing to clean an unexpected bin repository: $gitTopLevel"
          }
          git -C $binRoot reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset tracked bin files' }
          git -C $binRoot clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'failed to remove generated bin analysis state' }
  fork-analysis-blocked:
    needs: [classify, plan]
    if: needs.classify.outputs.route == 'source' && needs.plan.outputs.has_analysis == 'true' && needs.plan.outputs.same_repository
      != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fork PR analysis nodes require a trusted same-repository runner" && exit 1
  pr-validate:
    name: pr-validate
    needs: [classify, plan, validate-hosted, analyze-self-hosted, fork-analysis-blocked]
    if: always() && github.event.action != 'closed' && needs.classify.outputs.route == 'source'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one trusted PR route
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ROUTE: ${{ needs.classify.outputs.route }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == "success" ]]
          [[ "$ROUTE" == "source" ]]
      - name: Aggregate source validation results
        if: needs.classify.outputs.route == 'source'
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HOSTED_RESULT: ${{ needs.validate-hosted.result }}
          ANALYSIS_RESULT: ${{ needs.analyze-self-hosted.result }}
          FORK_RESULT: ${{ needs.fork-analysis-blocked.result }}
          HAS_ACTIONS: ${{ needs.plan.outputs.has_actions }}
          HAS_ANALYSIS: ${{ needs.plan.outputs.has_analysis }}
          HAS_HOSTED: ${{ needs.plan.outputs.has_hosted }}
          SAME_REPOSITORY: ${{ needs.plan.outputs.same_repository }}
        shell: bash
        run: |-
          set -euo pipefail
          failed=false
          require_result() {
            local job="$1"
            local actual="$2"
            local expected="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$job must be $expected, got $actual"
              failed=true
            fi
          }
          for flag in "$HAS_ACTIONS" "$HAS_ANALYSIS" "$HAS_HOSTED" "$SAME_REPOSITORY"; do
            if [[ "$flag" != "true" && "$flag" != "false" ]]; then
              echo "::error::planner emitted an invalid boolean output: $flag"
              failed=true
            fi
          done
          require_result "plan" "$PLAN_RESULT" "success"
          if [[ "$HAS_ANALYSIS" == "true" || "$HAS_HOSTED" == "true" ]]; then
            if [[ "$HAS_ACTIONS" != "true" ]]; then
              echo "::error::planner action outputs are inconsistent"
              failed=true
            fi
          fi
          if [[ "$HAS_HOSTED" == "true" ]]; then
            require_result "validate-hosted" "$HOSTED_RESULT" "success"
          else
            require_result "validate-hosted" "$HOSTED_RESULT" "skipped"
          fi
          if [[ "$HAS_ANALYSIS" == "true" && "$SAME_REPOSITORY" == "true" ]]; then
            require_result "analyze-self-hosted" "$ANALYSIS_RESULT" "success"
          else
            require_result "analyze-self-hosted" "$ANALYSIS_RESULT" "skipped"
          fi
          if [[ "$HAS_ANALYSIS" == "true" && "$SAME_REPOSITORY" != "true" ]]; then
            require_result "fork-analysis-blocked" "$FORK_RESULT" "failure"
            echo "::error::analysis nodes from a fork cannot use the self-hosted runner"
            failed=true
          else
            require_result "fork-analysis-blocked" "$FORK_RESULT" "skipped"
          fi
          [[ "$failed" == "false" ]]
