name: Release Build
run-name: Release build ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (e.g. v20260831a)
        required: true
        type: string
      source_sha:
        description: Full source SHA; publish requires default-branch ancestry, dry run requires the dispatch commit
        required: false
        type: string
      publish_release:
        description: Publish the verified bundle; disable only for a non-publishing verification run
        required: false
        default: true
        type: boolean
      source_artifact_mode:
        description: Rebuild analysis artifacts, or bind tracked Git artifacts without proving rebuildability
        required: false
        default: rebuild
        type: choice
        options:
          - rebuild
          - tracked
      cleanup_legacy_yaml:
        description: One-time cleanup of backed-up legacy accepted-bin YAML after the bundle is locally verified
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  contents: read
concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'HLND2T/GoldSrc_VibeSignatures'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_state: ${{ steps.resolve.outputs.release_state }}
      build_id: ${{ steps.resolve.outputs.build_id }}
      workflow_run_url: ${{ steps.resolve.outputs.workflow_run_url }}
      build_artifact_name: ${{ steps.resolve.outputs.build_artifact_name }}
      verified_artifact_name: ${{ steps.resolve.outputs.verified_artifact_name }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Resolve immutable release identity
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          default_ref="origin/${{ github.event.repository.default_branch }}"
          source_sha="${REQUESTED_SOURCE_SHA:-$(git rev-parse "$default_ref")}"
          uv run python -c "from release_workflow_lib.manifests import require_sha, require_version; require_version('$VERSION'); require_sha('$source_sha', 'SOURCE_SHA')"
          git cat-file -e "$source_sha^{commit}"
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            git merge-base --is-ancestor "$source_sha" "$default_ref"
          else
            test "$source_sha" = "${{ github.sha }}"
          fi
          git ls-tree "$source_sha" -- bin | grep '^160000 commit '
          uv run python release_publish.py preflight --repository "${{ github.repository }}" \
            --version "$VERSION" --source-sha "$source_sha" \
            --build-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_artifact_name=release-bundle-$VERSION-$source_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "verified_artifact_name=verified-release-bundle-$VERSION-$source_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
  warmup-idb:
    needs: preflight
    # A rebuild consumes the warm IDB cache; tracked publication binds committed artifacts and never opens an IDB.
    if: inputs.source_artifact_mode != 'tracked'
    uses: ./.github/workflows/warmup-idb.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      scope: release-all
      selection_artifact_name: idb-cache-selection-${{ github.run_id }}-${{ github.run_attempt }}
  build-release-bundle:
    needs: [preflight, warmup-idb]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
          (inputs.source_artifact_mode == 'tracked' || needs.warmup-idb.result == 'success') }}
    permissions:
      actions: read
      contents: read
    environment: win64
    runs-on: [self-hosted, cross-platform]
    timeout-minutes: 1440
    env:
      CI_KIND: release
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      SOURCE_ARTIFACT_MODE: ${{ inputs.source_artifact_mode || 'rebuild' }}
      PRODUCER_SELECTION_SHA256: ${{ needs.warmup-idb.outputs.selection_sha256 }}
      VERSION: ${{ needs.preflight.outputs.version }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      WORKFLOW_RUN_URL: ${{ needs.preflight.outputs.workflow_run_url }}
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
      GSVIBE_LLM_APIKEY: ${{ secrets.GSVIBE_LLM_APIKEY }}
      GSVIBE_LLM_BASEURL: ${{ secrets.GSVIBE_LLM_BASEURL }}
      GSVIBE_LLM_EFFORT: ${{ secrets.GSVIBE_LLM_EFFORT }}
      GSVIBE_LLM_MODEL: ${{ secrets.GSVIBE_LLM_MODEL }}
      GSVIBE_LLM_TEMPERATURE: ${{ secrets.GSVIBE_LLM_TEMPERATURE || '0' }}
      GSVIBE_ANALYSIS_MAX_CONCURRENCY: ${{ vars.GSVIBE_ANALYSIS_MAX_CONCURRENCY || '1' }}
      GSVIBE_ANALYSIS_MAX_MEMORY_MIB: ${{ vars.GSVIBE_ANALYSIS_MAX_MEMORY_MIB }}
      GSVIBE_ANALYSIS_INITIAL_WORKER_RESERVATION_MIB: ${{ vars.GSVIBE_ANALYSIS_INITIAL_WORKER_RESERVATION_MIB }}
    steps:
      - name: Checkout exact source and bin gitlink
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35  # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-goldsrc-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - run: uv sync --locked
      - name: Checkout cache transport tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - name: Clean binary analysis scratch
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: clean-bin
      - name: Download exact warm IDB selection
        if: inputs.source_artifact_mode != 'tracked'
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.warmup-idb.outputs.selection_artifact_name }}
          path: ${{ runner.temp }}/idb-cache-selection
      - name: Prepare disposable S3 staging
        id: s3-layout
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Download only selected immutable IDB objects
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: release-cache-fetch
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          PRODUCER_SELECTION_SHA256: ${{ needs.warmup-idb.outputs.selection_sha256 }}
      - name: Resolve IDA runtime identity
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: resolve-release-ida
      - name: Verify and restore warm IDBs
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: release-restore
        env:
          PRODUCER_SELECTION_SHA256: ${{ needs.warmup-idb.outputs.selection_sha256 }}
      - name: Force full analysis in a fresh artifact root
        if: inputs.source_artifact_mode != 'tracked'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: release-analyze
      - name: Bind tracked source-owned artifacts without rebuilding
        if: inputs.source_artifact_mode == 'tracked'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: release-bind
      - name: Upload batch analysis diagnostics
        if: always() && inputs.source_artifact_mode != 'tracked'
        uses: actions/upload-artifact@v7
        with:
          name: analysis-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/analysis-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
      - name: Upload unverified rebuilt artifact diagnostics
        if: failure() && inputs.source_artifact_mode != 'tracked'
        uses: actions/upload-artifact@v7
        with:
          name: unverified-rebuilt-bin-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebuilt-bin-artifacts
          if-no-files-found: warn
          retention-days: 1
      - name: Build game-symbol snapshots and JSON datasets
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: release-datasets
      - name: Build and locally verify release bundle
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: release-bundle
      - name: Upload release bundle transport artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.preflight.outputs.build_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Back up and clean legacy accepted-bin YAML
        if: inputs.cleanup_legacy_yaml
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: legacy-cleanup
      - name: Locate release artifacts for S3
        id: s3-artifacts
        if: always() && steps.s3-layout.outcome == 'success'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: artifacts
      - name: Persist release artifacts to S3
        if: always() && steps.s3-artifacts.outputs.available == 'true'
        uses: ./.ci-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.prefix }}-artifacts-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-artifacts.outputs.paths }}
      - name: Remove generated binary analysis state
        if: always()
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: cleanup
  verify-release-bundle:
    needs: [preflight, warmup-idb, build-release-bundle]
    if: >-
      ${{ !cancelled() && needs.build-release-bundle.result == 'success' &&
          (inputs.source_artifact_mode == 'tracked' || needs.warmup-idb.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload-verified.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source and bin gitlink
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify exact source remains on the default branch
        if: inputs.publish_release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}"
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
      - name: Download exact build transport artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.preflight.outputs.build_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Verify release bundle on GitHub-hosted runner
        run: |
          selection_args=()
          if [[ "${{ inputs.source_artifact_mode }}" != "tracked" ]]; then
            selection_args=(--cache-selection-sha256 "${{ needs.warmup-idb.outputs.selection_sha256 }}")
          fi
          uv run python release_bundle.py verify --repo-root "$GITHUB_WORKSPACE" \
            --source-artifact-mode "${{ inputs.source_artifact_mode || 'rebuild' }}" \
            --bundle-root "$RUNNER_TEMP/release-bundle" --version "${{ needs.preflight.outputs.version }}" \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --build-id "${{ needs.preflight.outputs.build_id }}" \
            --workflow-run-url "${{ needs.preflight.outputs.workflow_run_url }}" \
            "${selection_args[@]}"
      - name: Upload exact verified bundle
        id: upload-verified
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.preflight.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
  release-notes:
    needs: [preflight, verify-release-bundle]
    # Keep the status gate explicit: a skipped warmup-idb sits upstream, and an implicit success() here would
    # decide whether notes run based on the whole dependency graph rather than these two jobs.
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
          needs.verify-release-bundle.result == 'success' &&
          needs.preflight.outputs.release_state != 'published' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact release history
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install latest notes CLIs
        run: |
          npm install --global @anthropic-ai/claude-code@latest @openai/codex@latest
          claude --version
          codex --version
      - name: Prepare bounded release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          uv run python release_notes.py context --repository "${{ github.repository }}" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --output "$RUNNER_TEMP/release-context.txt"
      - name: Generate bilingual release notes
        env:
          RELEASE_NOTES_PROVIDER: ${{ vars.RELEASE_NOTES_PROVIDER || 'claude' }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          RELEASE_NOTES_BASE_URL: ${{ secrets.RELEASE_NOTES_BASE_URL }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          uv run python release_notes.py notes --repository "${{ github.repository }}" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --input "$RUNNER_TEMP/release-context.txt" --output "$RUNNER_TEMP/release-notes.md"
      - name: Bind notes artifact identity
        id: identity
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: echo "artifact_name=release-notes-$VERSION-$SOURCE_SHA-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload generated notes
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 7
  publish-release:
    needs: [preflight, warmup-idb, verify-release-bundle, release-notes]
    if: >-
      ${{ !cancelled() && inputs.publish_release && needs.preflight.result == 'success' &&
          (inputs.source_artifact_mode == 'tracked' || needs.warmup-idb.result == 'success') &&
          needs.verify-release-bundle.result == 'success' &&
          (needs.release-notes.result == 'success' ||
           (needs.preflight.outputs.release_state == 'published' && needs.release-notes.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout exact source and bin gitlink
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify exact Actions Artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ARTIFACT_NAME: ${{ needs.preflight.outputs.verified_artifact_name }}
          VERIFIED_ARTIFACT_DIGEST: ${{ needs.verify-release-bundle.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "$VERIFIED_ARTIFACT_DIGEST"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --slurp \
            | uv run python -c 'import json,os,sys; pages=json.load(sys.stdin); matches=[a for page in pages for a in page.get("artifacts",[]) if a.get("name")==os.environ["VERIFIED_ARTIFACT_NAME"]]; expected=os.environ["VERIFIED_ARTIFACT_DIGEST"].removeprefix("sha256:"); assert len(matches)==1 and str(matches[0].get("digest","")).removeprefix("sha256:")==expected, "verified Actions Artifact identity mismatch"'
      - name: Download exact verified bundle
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.preflight.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/verified-release-bundle
      - name: Verify exact notes Artifact identity
        if: needs.release-notes.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_ARTIFACT_NAME: ${{ needs.release-notes.outputs.artifact_name }}
          NOTES_ARTIFACT_DIGEST: ${{ needs.release-notes.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "$NOTES_ARTIFACT_NAME"
          test -n "$NOTES_ARTIFACT_DIGEST"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --slurp \
            | uv run python -c 'import json,os,sys; pages=json.load(sys.stdin); matches=[a for page in pages for a in page.get("artifacts",[]) if a.get("name")==os.environ["NOTES_ARTIFACT_NAME"]]; expected=os.environ["NOTES_ARTIFACT_DIGEST"].removeprefix("sha256:"); assert len(matches)==1 and not matches[0].get("expired") and str(matches[0].get("digest", "")).removeprefix("sha256:")==expected, "notes Actions Artifact identity mismatch"'
      - name: Download exact generated notes
        if: needs.release-notes.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.release-notes.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-notes
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          selection_args=()
          if [[ "${{ inputs.source_artifact_mode }}" != "tracked" ]]; then
            selection_args=(--cache-selection-sha256 "${{ needs.warmup-idb.outputs.selection_sha256 }}")
          fi
          uv run python release_publish.py publish --repository "${{ github.repository }}" \
            --source-artifact-mode "${{ inputs.source_artifact_mode || 'rebuild' }}" \
            --repo-root "$GITHUB_WORKSPACE" --bundle-root "$RUNNER_TEMP/verified-release-bundle" \
            --version "${{ needs.preflight.outputs.version }}" \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --build-id "${{ needs.preflight.outputs.build_id }}" \
            --workflow-run-url "${{ needs.preflight.outputs.workflow_run_url }}" \
            "${selection_args[@]}" \
            --notes-file "$RUNNER_TEMP/release-notes/release-notes.md"
      - name: Dispatch Pages from the published immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gh workflow run deploy-pages.yml --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "release_tag=${{ needs.preflight.outputs.version }}"
