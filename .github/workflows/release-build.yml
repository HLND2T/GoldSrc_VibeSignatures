name: Release Build
run-name: Release build ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release version (e.g. v20260831a)
        required: true
        type: string
      source_sha:
        description: Full source SHA; publish requires default-branch ancestry, dry run requires the dispatch commit
        required: false
        type: string
      publish_release:
        description: Publish the verified bundle; disable only for a non-publishing verification run
        required: false
        default: true
        type: boolean
permissions:
  actions: read
  contents: read
concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'HLND2T/GoldSrc_VibeSignatures'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_state: ${{ steps.resolve.outputs.release_state }}
      build_id: ${{ steps.resolve.outputs.build_id }}
      workflow_run_url: ${{ steps.resolve.outputs.workflow_run_url }}
      build_artifact_name: ${{ steps.resolve.outputs.build_artifact_name }}
      verified_artifact_name: ${{ steps.resolve.outputs.verified_artifact_name }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Resolve immutable release identity
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          default_ref="origin/${{ github.event.repository.default_branch }}"
          source_sha="${REQUESTED_SOURCE_SHA:-$(git rev-parse "$default_ref")}"
          uv run python -c "from release_workflow_lib.manifests import require_sha, require_version; require_version('$VERSION'); require_sha('$source_sha', 'SOURCE_SHA')"
          git cat-file -e "$source_sha^{commit}"
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            git merge-base --is-ancestor "$source_sha" "$default_ref"
          else
            test "$source_sha" = "${{ github.sha }}"
          fi
          git ls-tree "$source_sha" -- bin | grep '^160000 commit '
          uv run python release_publish.py preflight --repository "${{ github.repository }}" \
            --version "$VERSION" --source-sha "$source_sha" \
            --build-id "${{ github.run_id }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --github-output "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "build_artifact_name=release-bundle-$VERSION-$source_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "verified_artifact_name=verified-release-bundle-$VERSION-$source_sha-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
  warmup-idb:
    needs: preflight
    uses: ./.github/workflows/warmup-idb.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      scope: release-all
      selection_artifact_name: idb-cache-selection-${{ github.run_id }}-${{ github.run_attempt }}
  build-release-bundle:
    needs: [preflight, warmup-idb]
    if: needs.preflight.result == 'success' && needs.warmup-idb.result == 'success'
    permissions:
      actions: read
      contents: read
    environment: win64
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 1440
    env:
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
      GSVIBE_LLM_APIKEY: ${{ secrets.GSVIBE_LLM_APIKEY }}
      GSVIBE_LLM_BASEURL: ${{ secrets.GSVIBE_LLM_BASEURL }}
      GSVIBE_LLM_EFFORT: ${{ secrets.GSVIBE_LLM_EFFORT }}
      GSVIBE_LLM_MODEL: ${{ secrets.GSVIBE_LLM_MODEL || 'gpt-4o' }}
      GSVIBE_LLM_TEMPERATURE: ${{ secrets.GSVIBE_LLM_TEMPERATURE }}
    steps:
      - name: Checkout exact source and bin gitlink
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Clean binary analysis scratch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $binRoot = (Resolve-Path -LiteralPath (Join-Path $workspaceRoot 'bin')).Path
          if (-not $binRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "bin submodule escaped the checkout: $binRoot"
          }
          git -C $binRoot reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset bin submodule' }
          git -C $binRoot clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'failed to clean bin submodule' }
      - name: Download exact warm IDB selection
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.warmup-idb.outputs.selection_artifact_name }}
          path: ${{ runner.temp }}/idb-cache-selection
      - name: Resolve runtime identity and restore warm IDBs
        shell: pwsh
        env:
          PRODUCER_SELECTION_SHA256: ${{ needs.warmup-idb.outputs.selection_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PERSISTED_WORKSPACE) -or [string]::IsNullOrWhiteSpace($env:IDADIR)) {
            throw 'PERSISTED_WORKSPACE and IDADIR are required'
          }
          $idalibMcp = (Get-Command idalib-mcp -ErrorAction Stop).Source
          $kernelVersion = (& python ida_runtime_probe.py --idalib-mcp $idalibMcp | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($kernelVersion)) { throw 'failed to resolve IDA kernel version' }
          $selectionRoot = Join-Path $env:RUNNER_TEMP 'idb-cache-selection'
          $selectionSha = (Get-Content -Raw -LiteralPath (Join-Path $selectionRoot 'cache-selection.sha256')).Trim()
          if ($selectionSha -ne $env:PRODUCER_SELECTION_SHA256) { throw 'cache selection digest mismatch' }
          uv run python idb_cache_release.py verify -repo-root $env:GITHUB_WORKSPACE -bindir bin `
            -persisted-root $env:PERSISTED_WORKSPACE -ida-root $env:IDADIR -kernel-version $kernelVersion `
            -source-sha "${{ needs.preflight.outputs.source_sha }}" `
            -selection (Join-Path $selectionRoot 'cache-selection.json') `
            -selection-sha256 (Join-Path $selectionRoot 'cache-selection.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'warm IDB selection verification failed' }
          uv run python idb_cache_release.py restore -repo-root $env:GITHUB_WORKSPACE -bindir bin `
            -persisted-root $env:PERSISTED_WORKSPACE -ida-root $env:IDADIR -kernel-version $kernelVersion `
            -source-sha "${{ needs.preflight.outputs.source_sha }}" `
            -selection (Join-Path $selectionRoot 'cache-selection.json') `
            -selection-sha256 (Join-Path $selectionRoot 'cache-selection.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'warm IDB restore failed' }
          $runtimePath = Join-Path $env:RUNNER_TEMP 'ida-runtime.json'
          uv run python -c "from release_workflow_lib.hashing import write_canonical_json; write_canonical_json(r'$runtimePath', {'kernel_version': r'$kernelVersion', 'idalib_mcp_sha256': __import__('hashlib').sha256(open(r'$idalibMcp','rb').read()).hexdigest()})"
          "IDA_KERNEL_VERSION=$kernelVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "IDA_RUNTIME_PATH=$runtimePath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Force full analysis in a fresh artifact root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'rebuilt-bin-artifacts'
          if (Test-Path -LiteralPath $artifactRoot) { Remove-Item -LiteralPath $artifactRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null
          uv run python ida_analyze_bin.py -allgamever -force_all -bindir bin -artifactdir $artifactRoot `
            -debug -process_reporter console
          if ($LASTEXITCODE -ne 0) { throw 'fresh all-gamever analysis failed' }
          uv run python bin_artifact_contract.py --repo-root $env:GITHUB_WORKSPACE --actual-root $artifactRoot
          if ($LASTEXITCODE -ne 0) { throw 'rebuilt artifacts differ from Git truth' }
          git diff --exit-code -- bin_artifacts
          if ($LASTEXITCODE -ne 0) { throw 'tracked bin_artifacts changed during release rebuild' }
          "REBUILT_ARTIFACT_ROOT=$artifactRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload unverified rebuilt artifact diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unverified-rebuilt-bin-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rebuilt-bin-artifacts
          if-no-files-found: warn
          retention-days: 1
      - name: Build snapshots, gamedata, and deterministic archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generatedRoot = Join-Path $env:RUNNER_TEMP 'release-generated'
          if (Test-Path -LiteralPath $generatedRoot) { Remove-Item -LiteralPath $generatedRoot -Recurse -Force }
          $gamesymbolsRoot = Join-Path $generatedRoot 'gamesymbols'
          $gamedataRoot = Join-Path $generatedRoot 'gamedata'
          $archivesRoot = Join-Path $generatedRoot 'archives'
          New-Item -ItemType Directory -Path $gamesymbolsRoot,$gamedataRoot,$archivesRoot -Force | Out-Null
          $publishTime = (git show -s --format=%cI HEAD | uv run python -c "import sys; from datetime import datetime,timezone; print(datetime.fromisoformat(sys.stdin.read().strip()).astimezone(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))").Trim()
          $sourceTime = [DateTime]::Parse($publishTime).ToUniversalTime()
          $gamevers = @(uv run python -c "import yaml; print('\n'.join((yaml.safe_load(open('configs/config.yaml', encoding='utf-8')) or {})['gamevers']))")
          foreach ($gamever in $gamevers) {
            if ([string]::IsNullOrWhiteSpace($gamever)) { throw 'configs/config.yaml contains an empty game version' }
            $stage = Join-Path $env:RUNNER_TEMP ("release-candidate-" + $gamever)
            if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            $candidate = Join-Path $stage "$gamever.yaml"
            $symbolSession = Join-Path $stage 'symbol-session.json'
            $gamedataSession = Join-Path $stage 'gamedata-session.json'
            uv run python gamesymbol_candidate.py build -gamever $gamever -bindir bin `
              -artifactdir $env:REBUILT_ARTIFACT_ROOT -configyaml "configs/$gamever.yaml" `
              -output $candidate -session $symbolSession -last-publish-time $publishTime
            if ($LASTEXITCODE -ne 0) { throw "snapshot candidate failed for $gamever" }
            uv run python gamedata_candidate.py build -gamever $gamever -build-id "${{ needs.preflight.outputs.build_id }}" `
              -snapshot $candidate -configyaml "configs/$gamever.yaml" -modulesdir gamedata-generators `
              -candidate-root (Join-Path $stage 'gamedata') -session $gamedataSession
            if ($LASTEXITCODE -ne 0) { throw "gamedata candidate failed for $gamever" }
            uv run python gamesymbol_candidate.py mark -candidate $candidate -session $symbolSession `
              -step gamedata -gamedata-session $gamedataSession
            if ($LASTEXITCODE -ne 0) { throw "candidate guard failed for $gamever" }
            uv run python gamesymbol_candidate.py publish -candidate $candidate -session $symbolSession `
              -destination (Join-Path $gamesymbolsRoot "$gamever.yaml")
            if ($LASTEXITCODE -ne 0) { throw "snapshot publish failed for $gamever" }
            uv run python gamedata_candidate.py publish -session $gamedataSession -outputdir (Join-Path $gamedataRoot $gamever)
            if ($LASTEXITCODE -ne 0) { throw "gamedata publish failed for $gamever" }
            $gamedataStage = Join-Path $env:RUNNER_TEMP ("gamedata-archive-" + $gamever)
            $gamebinStage = Join-Path $env:RUNNER_TEMP ("gamebin-archive-" + $gamever)
            foreach ($archiveStage in @($gamedataStage, $gamebinStage)) {
              if (Test-Path -LiteralPath $archiveStage) { Remove-Item -LiteralPath $archiveStage -Recurse -Force }
            }
            New-Item -ItemType Directory -Path (Join-Path $gamedataStage 'configs') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $gamedataStage 'bin_artifacts') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $gamedataStage 'gamesymbols') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $gamedataStage 'gamedata') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $gamedataStage 'bin') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $gamebinStage 'bin') -Force | Out-Null
            Copy-Item -LiteralPath "configs/$gamever.yaml" -Destination (Join-Path $gamedataStage "configs/$gamever.yaml")
            Copy-Item -LiteralPath (Join-Path $env:REBUILT_ARTIFACT_ROOT $gamever) -Destination (Join-Path $gamedataStage 'bin_artifacts') -Recurse
            Copy-Item -LiteralPath (Join-Path $gamesymbolsRoot "$gamever.yaml") -Destination (Join-Path $gamedataStage 'gamesymbols')
            Copy-Item -LiteralPath (Join-Path $gamesymbolsRoot "$gamever.metadata.yaml") -Destination (Join-Path $gamedataStage 'gamesymbols')
            Copy-Item -LiteralPath (Join-Path $gamedataRoot $gamever) -Destination (Join-Path $gamedataStage 'gamedata') -Recurse
            uv run python release_bundle.py stage-binary --repo-root $env:GITHUB_WORKSPACE --gamever $gamever `
              --destination (Join-Path $gamedataStage "bin/$gamever")
            if ($LASTEXITCODE -ne 0) { throw "gamedata binary staging failed for $gamever" }
            uv run python release_bundle.py stage-binary --repo-root $env:GITHUB_WORKSPACE --gamever $gamever `
              --destination (Join-Path $gamebinStage "bin/$gamever")
            if ($LASTEXITCODE -ne 0) { throw "gamebin binary staging failed for $gamever" }
            foreach ($archiveStage in @($gamedataStage, $gamebinStage)) {
              Get-ChildItem -LiteralPath $archiveStage -Recurse -Force | ForEach-Object { $_.LastWriteTimeUtc = $sourceTime }
            }
            Push-Location $gamedataStage
            try {
              7z a -t7z -mx=9 -mmt=off -mtc=off -mta=off (Join-Path $archivesRoot "gamedata-$gamever.7z") '.\*' | Out-Host
              $archiveExitCode = $LASTEXITCODE
            }
            finally { Pop-Location }
            if ($archiveExitCode -ne 0) { throw "gamedata archive failed for $gamever" }
            Push-Location $gamebinStage
            try {
              7z a -t7z -mx=9 -mmt=off -mtc=off -mta=off (Join-Path $archivesRoot "gamebin-$gamever.7z") '.\*' | Out-Host
              $archiveExitCode = $LASTEXITCODE
            }
            finally { Pop-Location }
            if ($archiveExitCode -ne 0) { throw "gamebin archive failed for $gamever" }
          }
          "GENERATED_ROOT=$generatedRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and locally verify release bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = Join-Path $env:RUNNER_TEMP 'release-bundle'
          if (Test-Path -LiteralPath $bundleRoot) { Remove-Item -LiteralPath $bundleRoot -Recurse -Force }
          uv run python release_bundle.py build --repo-root $env:GITHUB_WORKSPACE --bundle-root $bundleRoot `
            --gamesymbols-root (Join-Path $env:GENERATED_ROOT 'gamesymbols') `
            --gamedata-root (Join-Path $env:GENERATED_ROOT 'gamedata') `
            --archives-root (Join-Path $env:GENERATED_ROOT 'archives') `
            --ida-runtime $env:IDA_RUNTIME_PATH `
            --cache-selection (Join-Path $env:RUNNER_TEMP 'idb-cache-selection\cache-selection.json') `
            --version "${{ needs.preflight.outputs.version }}" --build-id "${{ needs.preflight.outputs.build_id }}" `
            --workflow-run-url "${{ needs.preflight.outputs.workflow_run_url }}" `
            --source-sha "${{ needs.preflight.outputs.source_sha }}"
          if ($LASTEXITCODE -ne 0) { throw 'release bundle build failed' }
          uv run python release_bundle.py verify --repo-root $env:GITHUB_WORKSPACE --bundle-root $bundleRoot `
            --version "${{ needs.preflight.outputs.version }}" `
            --source-sha "${{ needs.preflight.outputs.source_sha }}" `
            --build-id "${{ needs.preflight.outputs.build_id }}" `
            --workflow-run-url "${{ needs.preflight.outputs.workflow_run_url }}" `
            --cache-selection-sha256 "${{ needs.warmup-idb.outputs.selection_sha256 }}"
          if ($LASTEXITCODE -ne 0) { throw 'local release bundle verification failed' }
      - name: Upload release bundle transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.build_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
      - name: Remove generated binary analysis state
        if: always()
        shell: pwsh
        run: |
          $binRoot = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'bin')).Path
          git -C $binRoot reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset bin submodule' }
          git -C $binRoot clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'failed to clean bin submodule' }
  verify-release-bundle:
    needs: [preflight, warmup-idb, build-release-bundle]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_digest: ${{ steps.upload-verified.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source and bin gitlink
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify exact source remains on the default branch
        if: inputs.publish_release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.preflight.outputs.source_sha }}"
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor HEAD "origin/${{ github.event.repository.default_branch }}"
      - name: Download exact build transport artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.build_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
      - name: Verify release bundle on GitHub-hosted runner
        run: |
          uv run python release_bundle.py verify --repo-root "$GITHUB_WORKSPACE" \
            --bundle-root "$RUNNER_TEMP/release-bundle" --version "${{ needs.preflight.outputs.version }}" \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --build-id "${{ needs.preflight.outputs.build_id }}" \
            --workflow-run-url "${{ needs.preflight.outputs.workflow_run_url }}" \
            --cache-selection-sha256 "${{ needs.warmup-idb.outputs.selection_sha256 }}"
      - name: Upload exact verified bundle
        id: upload-verified
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 7
  publish-release:
    needs: [preflight, warmup-idb, verify-release-bundle]
    if: inputs.publish_release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout exact source and bin gitlink
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify exact Actions Artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_ARTIFACT_NAME: ${{ needs.preflight.outputs.verified_artifact_name }}
          VERIFIED_ARTIFACT_DIGEST: ${{ needs.verify-release-bundle.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          test -n "$VERIFIED_ARTIFACT_DIGEST"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --slurp \
            | uv run python -c 'import json,os,sys; pages=json.load(sys.stdin); matches=[a for page in pages for a in page.get("artifacts",[]) if a.get("name")==os.environ["VERIFIED_ARTIFACT_NAME"]]; expected=os.environ["VERIFIED_ARTIFACT_DIGEST"].removeprefix("sha256:"); assert len(matches)==1 and str(matches[0].get("digest","")).removeprefix("sha256:")==expected, "verified Actions Artifact identity mismatch"'
      - name: Download exact verified bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.verified_artifact_name }}
          path: ${{ runner.temp }}/verified-release-bundle
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          uv run python release_publish.py publish --repository "${{ github.repository }}" \
            --repo-root "$GITHUB_WORKSPACE" --bundle-root "$RUNNER_TEMP/verified-release-bundle" \
            --version "${{ needs.preflight.outputs.version }}" \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --build-id "${{ needs.preflight.outputs.build_id }}" \
            --workflow-run-url "${{ needs.preflight.outputs.workflow_run_url }}" \
            --cache-selection-sha256 "${{ needs.warmup-idb.outputs.selection_sha256 }}"
      - name: Dispatch Pages from the published immutable Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gh workflow run deploy-pages.yml --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "release_tag=${{ needs.preflight.outputs.version }}"
