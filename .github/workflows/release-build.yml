name: Release Build
run-name: Release build ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. v20260825a)
        required: true
        type: string
      source_sha:
        description: Full immutable commit SHA reachable from the default branch (defaults to default branch HEAD)
        required: false
        type: string
      mode:
        description: Release lifecycle mode
        required: true
        type: choice
        options: [new, republish]
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.repository }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'HLND2T/GoldSrc_VibeSignatures'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      cache_mode: ${{ steps.resolve.outputs.cache_mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Resolve release build identity
        id: resolve
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODE: ${{ inputs.mode }}
          CACHE_MODE: ${{ vars.GSVIBE_IDB_CACHE_MODE || 'cold' }}
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.repository.default_branch }}"
          source_sha="${SOURCE_SHA:-$(git rev-parse "origin/${{ github.event.repository.default_branch }}")}"
          uv run python release_workflow.py validate-build \
            --repository "${{ github.repository }}" \
            --version "$VERSION" \
            --source-sha "$source_sha" \
            --mode "$MODE" \
            --default-ref "origin/${{ github.event.repository.default_branch }}"
          if [[ "$CACHE_MODE" != "warm" && "$CACHE_MODE" != "cold" ]]; then
            echo "::error::unsupported IDB cache mode: $CACHE_MODE"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "cache_mode=$CACHE_MODE" >> "$GITHUB_OUTPUT"
  warmup-idb:
    needs: preflight
    if: needs.preflight.outputs.cache_mode == 'warm'
    uses: ./.github/workflows/warmup-idb.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      scope: release-all
      cache_mode: ${{ needs.preflight.outputs.cache_mode }}
      selection_artifact_name: idb-cache-selection-${{ github.run_id }}-${{ github.run_attempt }}
  build:
    needs: [preflight, warmup-idb]
    # Warm builds require a successful producer; cold builds require it to have been skipped.
    # A failed or cancelled producer must never fall back to warming inside the consumer.
    if: |
      always() && needs.preflight.result == 'success'
      && ((needs.preflight.outputs.cache_mode == 'warm' && needs.warmup-idb.result == 'success')
      || (needs.preflight.outputs.cache_mode == 'cold' && needs.warmup-idb.result == 'skipped'))
    environment: win64
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 1440
    env:
      PERSISTED_WORKSPACE: ${{ secrets.PERSISTED_WORKSPACE }}
      GSVIBE_LLM_APIKEY: ${{ secrets.GSVIBE_LLM_APIKEY }}
      GSVIBE_LLM_BASEURL: ${{ secrets.GSVIBE_LLM_BASEURL }}
      GSVIBE_LLM_EFFORT: ${{ secrets.GSVIBE_LLM_EFFORT }}
      GSVIBE_LLM_MODEL: ${{ secrets.GSVIBE_LLM_MODEL || 'gpt-4o' }}
      GSVIBE_LLM_TEMPERATURE: ${{ secrets.GSVIBE_LLM_TEMPERATURE }}
      SUBMODULE_CACHE_VERSION: v1
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
      - name: Compute submodule cache key
        id: submodule-cache-key
        shell: pwsh
        run: |
          $content = @()
          $content += Get-Content -Raw .gitmodules
          $content += ""
          # Hash the committed bin gitlink SHA (not the working-tree submodule
          # state, which drifts between uninitialized and initialized) so the
          # key is deterministic and shared by runs pinning the same bin commit.
          $content += git ls-tree HEAD -- bin
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = [System.Text.Encoding]::UTF8.GetBytes(($content -join "`n"))
          $hash = [System.BitConverter]::ToString($sha.ComputeHash($bytes)).Replace("-", "").ToLowerInvariant()
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore submodule cache
        id: restore-submodule-cache
        uses: actions/cache@v5
        with:
          path: |
            .git/modules
            bin
          key: ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-${{ steps.submodule-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-submodules-${{ env.SUBMODULE_CACHE_VERSION }}-
      - name: Sync and update submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "git submodule sync failed." }
          git submodule update --init --recursive --force --depth 1 --jobs 8
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed." }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Resolve IDA interpreter identity
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python -ErrorAction SilentlyContinue).Source
          $idalibMcpExe = (Get-Command idalib-mcp -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or [string]::IsNullOrWhiteSpace($idalibMcpExe)) {
            throw 'python with idalib and idalib-mcp must both be available on PATH'
          }
          $probe = Join-Path $env:GITHUB_WORKSPACE 'ida_runtime_probe.py'
          $idaVersionOutput = & $pythonExe $probe --idalib-mcp $idalibMcpExe
          $probeExitCode = $LASTEXITCODE
          $idaVersion = (@($idaVersionOutput) -join "`n").Trim()
          if ($probeExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($idaVersion)) {
            throw 'Failed to resolve the IDA kernel version from the idalib-mcp installation'
          }
          "IDA_KERNEL_VERSION=$idaVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Clean the bin submodule before materialization
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PERSISTED_WORKSPACE)) {
            throw 'PERSISTED_WORKSPACE is required'
          }
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $binRoot = (Resolve-Path -LiteralPath (Join-Path $workspaceRoot 'bin')).Path
          if (-not $binRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "bin submodule escaped the checked-out workspace: $binRoot"
          }
          $gitTopLevel = (git -C $binRoot rev-parse --show-toplevel).Trim()
          if ($LASTEXITCODE -ne 0 -or $([IO.Path]::GetFullPath($gitTopLevel)) -ne [IO.Path]::GetFullPath($binRoot)) {
            throw "Refusing to clean an unexpected bin repository: $gitTopLevel"
          }
          git -C $binRoot reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset tracked bin files' }
          git -C $binRoot clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'failed to clean persisted bin analysis state' }
      - name: Materialize accepted bin for every game version
        shell: pwsh
        run: |
          uv run python release_workflow.py materialize-accepted-bin `
            --repo-root "$env:GITHUB_WORKSPACE" --persisted-root "$env:PERSISTED_WORKSPACE" --bindir bin --all-gamevers
          if ($LASTEXITCODE -ne 0) { throw 'accepted bin materialization failed' }
      - name: Invalidate republish outputs
        if: needs.preflight.outputs.mode == 'republish'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gamevers = uv run python -c "import yaml; print('\n'.join((yaml.safe_load(open('configs/config.yaml', encoding='utf-8')) or {}).get('gamevers', [])))"
          foreach ($gamever in ($gamevers -split "`n")) {
            uv run python release_workflow.py invalidate-republish --repo-root $env:GITHUB_WORKSPACE --gamever $gamever `
              --version "${{ needs.preflight.outputs.version }}" --source-sha "${{ needs.preflight.outputs.source_sha }}" --bindir bin
            if ($LASTEXITCODE -ne 0) { throw "invalidate-republish failed for $gamever" }
          }
      - name: Download the exact warm IDB cache selection
        if: needs.preflight.outputs.cache_mode == 'warm'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.warmup-idb.outputs.selection_artifact_name }}
          path: ${{ runner.temp }}/idb-cache-selection
      - name: Verify the exact warm IDB cache selection
        if: needs.preflight.outputs.cache_mode == 'warm'
        shell: pwsh
        env:
          PRODUCER_SELECTION_SHA256: ${{ needs.warmup-idb.outputs.selection_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'idb-cache-selection'
          $evidence = (Get-Content -Raw -LiteralPath (Join-Path $bundle 'cache-selection.sha256')).Trim()
          if ($evidence -ne $env:PRODUCER_SELECTION_SHA256) {
            throw 'downloaded cache selection evidence does not match the producer job output'
          }
          uv run python idb_cache_release.py verify `
            -repo-root $env:GITHUB_WORKSPACE -bindir bin -persisted-root $env:PERSISTED_WORKSPACE `
            -ida-root $env:IDADIR -kernel-version $env:IDA_KERNEL_VERSION `
            -source-sha "${{ needs.preflight.outputs.source_sha }}" `
            -selection (Join-Path $bundle 'cache-selection.json') `
            -selection-sha256 (Join-Path $bundle 'cache-selection.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'warm cache selection verification failed' }
      - name: Restore the exact warm IDB cache generations
        if: needs.preflight.outputs.cache_mode == 'warm'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'idb-cache-selection'
          uv run python idb_cache_release.py restore `
            -repo-root $env:GITHUB_WORKSPACE -bindir bin -persisted-root $env:PERSISTED_WORKSPACE `
            -ida-root $env:IDADIR -kernel-version $env:IDA_KERNEL_VERSION `
            -source-sha "${{ needs.preflight.outputs.source_sha }}" `
            -selection (Join-Path $bundle 'cache-selection.json') `
            -selection-sha256 (Join-Path $bundle 'cache-selection.sha256')
          if ($LASTEXITCODE -ne 0) { throw 'warm cache restore failed' }
      - name: Analyze all game versions
        shell: pwsh
        run: |
          uv run python ida_analyze_bin.py -allgamever -cache_mode "${{ needs.preflight.outputs.cache_mode }}" -debug -process_reporter console
          if ($LASTEXITCODE -ne 0) { throw 'all-gamever analysis failed' }
      - name: Build, guard, and publish candidates for every game version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gamevers = uv run python -c "import yaml; print('\n'.join((yaml.safe_load(open('configs/config.yaml', encoding='utf-8')) or {}).get('gamevers', [])))"
          $candidateRoot = Join-Path $env:RUNNER_TEMP "release-candidates\${{ github.run_id }}-${{ github.run_attempt }}"
          New-Item -ItemType Directory -Path $candidateRoot -Force | Out-Null
          $gameversJson = @{}
          foreach ($gamever in ($gamevers -split "`n")) {
            $candidate = Join-Path $candidateRoot "$gamever.yaml"
            $session = Join-Path $candidateRoot "$gamever.session.json"
            $gamedataSession = Join-Path $candidateRoot "$gamever.gamedata.session.json"
            uv run python gamesymbol_candidate.py build -gamever $gamever -bindir bin -configyaml "configs/$gamever.yaml" -output $candidate -session $session
            if ($LASTEXITCODE -ne 0) { throw "candidate build failed for $gamever" }
            uv run python gamesymbol_candidate.py guard -candidate $candidate -session $session
            if ($LASTEXITCODE -ne 0) { throw "candidate guard failed for $gamever" }
            uv run python gamedata_candidate.py build -gamever $gamever -build-id "${{ github.run_id }}-${{ github.run_attempt }}" `
              -snapshot $candidate -configyaml "configs/$gamever.yaml" -modulesdir gamedata-generators `
              -candidate-root (Join-Path $candidateRoot "gamedata-$gamever") -session $gamedataSession
            if ($LASTEXITCODE -ne 0) { throw "gamedata build failed for $gamever" }
            uv run python gamedata_candidate.py guard -session $gamedataSession
            if ($LASTEXITCODE -ne 0) { throw "gamedata guard failed for $gamever" }
            uv run python gamesymbol_candidate.py mark -candidate $candidate -session $session -step gamedata -gamedata-session $gamedataSession
            if ($LASTEXITCODE -ne 0) { throw "candidate mark failed for $gamever" }
            uv run python gamesymbol_candidate.py publish -candidate $candidate -session $session -destination "gamesymbols/$gamever.yaml"
            if ($LASTEXITCODE -ne 0) { throw "candidate publish failed for $gamever" }
            uv run python gamedata_candidate.py publish -session $gamedataSession -outputdir "gamedata/$gamever"
            if ($LASTEXITCODE -ne 0) { throw "gamedata publish failed for $gamever" }
            $gameversJson[$gamever] = @{
              bin_source = (Join-Path $env:GITHUB_WORKSPACE "bin\$gamever")
              candidate = $candidate
              gamedata_session = $gamedataSession
            }
          }
          $gameversJson | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $candidateRoot "gamevers.json") -Encoding utf8
          "GAMEVERS_JSON=$(Join-Path $candidateRoot 'gamevers.json')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OUTPUT_BRANCH=gamesymbols/build/${{ needs.preflight.outputs.version }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage validated output
        shell: pwsh
        run: |
          uv run python release_workflow.py stage-build \
            --repo-root "$env:GITHUB_WORKSPACE" \
            --staging-root "$env:PERSISTED_WORKSPACE\release-staging" \
            --gamevers-json "$env:GAMEVERS_JSON" \
            --repository "${{ github.repository }}" \
            --output-branch "$env:OUTPUT_BRANCH" \
            --version "${{ needs.preflight.outputs.version }}" \
            --mode "${{ needs.preflight.outputs.mode }}" \
            --build-id "$env:BUILD_ID" \
            --source-sha "${{ needs.preflight.outputs.source_sha }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if ($LASTEXITCODE -ne 0) { throw 'stage-build failed' }
      - name: Create generated-output pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$env:OUTPUT_BRANCH"
          git add "gamesymbols" "gamedata" "release-manifests"
          git commit -m "chore(gamesymbols): publish ${{ needs.preflight.outputs.version }} build $env:BUILD_ID" `
            -m "Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          $headSha = git rev-parse HEAD
          uv run python release_workflow.py finalize-stage `
            --repo-root "$env:GITHUB_WORKSPACE" --staging-root "$env:PERSISTED_WORKSPACE\release-staging" `
            --version "${{ needs.preflight.outputs.version }}" --build-id "$env:BUILD_ID" --pr-head-sha $headSha
          git push origin "HEAD:refs/heads/$env:OUTPUT_BRANCH"
          $prNumber = gh pr create --base "${{ github.event.repository.default_branch }}" --head "$env:OUTPUT_BRANCH" `
            --title "chore(gamesymbols): publish ${{ needs.preflight.outputs.version }} build $env:BUILD_ID" `
            --body "Validated release output from immutable source ${{ needs.preflight.outputs.source_sha }}. Merge is the promotion gate."
          uv run python release_workflow.py write-pr-index `
            --staging-root "$env:PERSISTED_WORKSPACE\release-staging" --pr-number $prNumber `
            --version "${{ needs.preflight.outputs.version }}" --build-id "$env:BUILD_ID" --pr-head-sha $headSha
      - name: Remove generated submodule analysis state
        if: always()
        shell: pwsh
        run: |
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $binRoot = (Resolve-Path -LiteralPath (Join-Path $workspaceRoot 'bin')).Path
          if (-not $binRoot.StartsWith($workspaceRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "bin submodule escaped the checked-out workspace: $binRoot"
          }
          $gitTopLevel = (git -C $binRoot rev-parse --show-toplevel).Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($gitTopLevel) -ne [IO.Path]::GetFullPath($binRoot)) {
            throw "Refusing to clean an unexpected bin repository: $gitTopLevel"
          }
          # reset --hard reverts tracked-file modifications (materialized accepted
          # binaries) before the cache post-save, so a later self-hosted PR analysis
          # never restores a dirty submodule; git clean handles the untracked side.
          git -C $binRoot reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'failed to reset tracked bin files' }
          git -C $binRoot clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'failed to remove generated bin analysis state' }
      - name: Clean incomplete staging on failure
        if: failure()
        shell: pwsh
        run: |-
          uv run python release_workflow.py cleanup-incomplete `
            --staging-root "$env:PERSISTED_WORKSPACE\release-staging" `
            --version "${{ needs.preflight.outputs.version }}" --build-id "${{ github.run_id }}-${{ github.run_attempt }}"
