name: Warm IDB Cache
run-name: Warm IDB cache ${{ inputs.scope }} ${{ inputs.source_sha }}
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-hex commit the producer must check out
        required: true
        type: string
      scope:
        description: Producer scope, either release-all or bound-plan
        required: true
        type: string
      selection_artifact_name:
        description: Caller-constructed artifact name carrying the exact cache selection
        required: true
        type: string
      plan_artifact_name:
        description: Bound plan artifact name; required for the bound-plan scope
        required: false
        type: string
      plan_sha256:
        description: Bound plan SHA-256; required for the bound-plan scope
        required: false
        type: string
    outputs:
      cache_key:
        description: Exact verified S3 IDB snapshot key
        value: ${{ jobs.warmup.outputs.cache_key }}
      selection_artifact_name:
        description: Artifact carrying cache-selection.json and cache-selection.sha256
        value: ${{ jobs.warmup.outputs.selection_artifact_name }}
      selection_sha256:
        description: SHA-256 of the canonical cache selection bytes
        value: ${{ jobs.warmup.outputs.selection_sha256 }}
      selection_schema_version:
        description: Schema version of the published cache selection
        value: ${{ jobs.warmup.outputs.selection_schema_version }}
      source_sha:
        description: Exact source commit the producer used
        value: ${{ jobs.warmup.outputs.source_sha }}
permissions:
  contents: read
jobs:
  warmup:
    if: github.repository == 'HLND2T/GoldSrc_VibeSignatures' || github.repository == 'hzqst/GoldSrc_VibeSignatures'
    environment: win64
    runs-on: [self-hosted, cross-platform]
    timeout-minutes: 1440
    # One producer per repository. Release and source-PR callers must resolve to this exact
    # group string so the scheduler can never run two persisted IDB cache writers at once.
    concurrency:
      group: idb-warmup-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      cache_key: ${{ steps.s3-layout.outputs.prefix }}-idb-${{ github.run_id }}-${{ github.run_attempt }}
      selection_artifact_name: ${{ steps.publish.outputs.selection_artifact_name }}
      selection_sha256: ${{ steps.publish.outputs.selection_sha256 }}
      selection_schema_version: ${{ steps.publish.outputs.selection_schema_version }}
      source_sha: ${{ steps.publish.outputs.source_sha }}
    env:
      CI_KIND: warmup
      SELECTION_ARTIFACT_NAME: ${{ inputs.selection_artifact_name }}
      # IDB_CACHE_ROOT is disposable staging populated from S3.
      SOURCE_SHA: ${{ inputs.source_sha }}
      SCOPE: ${{ inputs.scope }}
      PLAN_ARTIFACT_NAME: ${{ inputs.plan_artifact_name }}
      PLAN_SHA256: ${{ inputs.plan_sha256 }}
      IDB_WARMUP_MAX_CONCURRENCY: ${{ vars.IDB_WARMUP_MAX_CONCURRENCY || '2' }}
      IDB_WARMUP_MAX_MEMORY_MIB: ${{ vars.IDB_WARMUP_MAX_MEMORY_MIB }}
    steps:
      - name: Checkout exact producer source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GSVIBE_BIN_TOKEN || github.token }}
      - uses: hzqst/setup-uv@ed37cb7af6cd89cb8e2ea2f20674ba1d05dc7b35  # S3 cache backend
        with:
          # enable-cache: auto resolves to false on self-hosted runners, so the uv
          # cache is shared through the existing repository S3 bucket instead.
          enable-cache: true
          cache-s3-bucket: actions-cache-goldsrc-vibesignatures
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      - run: uv sync --locked
      - name: Checkout cache transport tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          persist-credentials: false
      - name: Validate producer inputs and immutable source checkout
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: validate-producer
      - name: Sync and update the exact bin submodule
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: sync-submodules
      - name: Clean the bin submodule before materialization
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: clean-bin
      - name: Prepare disposable S3 staging
        id: s3-layout
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: cache-prepare
      - name: Restore reusable IDB snapshot
        uses: ./.ci-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: restore
          key: ${{ steps.s3-layout.outputs.prefix }}-idb-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-layout.outputs.cache-path }}
          restore-keys: ${{ steps.s3-layout.outputs.restore-prefixes }}
      - name: Materialize accepted bin for every release game version
        if: inputs.scope == 'release-all'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: warm-materialize
      - name: Resolve IDA interpreter identity
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: resolve-warm-ida
      - name: Download the bound plan
        if: inputs.scope == 'bound-plan'
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ runner.temp }}/idb-cache-selection
      - name: Verify the bound plan SHA-256
        if: inputs.scope == 'bound-plan'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: verify-plan
      - name: Prepare the exact warm IDB cache selection
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: warm-prepare
      - name: Verify the published cache selection
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: warm-verify
      - name: Publish verified IDB snapshot
        uses: ./.ci-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.prefix }}-idb-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-layout.outputs.cache-path }}
      - name: Publish producer outputs
        id: publish
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: warm-outputs
      - name: Upload the exact cache selection
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.selection_artifact_name }}
          path: |
            ${{ runner.temp }}/idb-cache-selection/cache-selection.json
            ${{ runner.temp }}/idb-cache-selection/cache-selection.sha256
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Locate warmup artifacts for S3
        id: s3-artifacts
        if: always() && steps.s3-layout.outcome == 'success'
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: artifacts
      - name: Persist warmup artifacts to S3
        if: always() && steps.s3-artifacts.outputs.available == 'true'
        uses: ./.ci-tools/.github/actions/s3-cache
        with:
          endpoint-url: ${{ secrets.S3_ENDPOINT_URL }}
          access-key: ${{ secrets.S3_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          operation: save
          key: ${{ steps.s3-layout.outputs.prefix }}-artifacts-warmup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.s3-artifacts.outputs.paths }}
      - name: Remove producer workspace analysis state
        if: always()
        uses: ./.ci-tools/.github/actions/ci-command
        with:
          command: cleanup
