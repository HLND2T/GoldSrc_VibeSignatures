name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run python format_repo_files.py --check
      - name: Unit tests
        run: uv run python tests/run_test_suite.py unit -b --durations 30
      - name: Repository contract
        run: uv run python tests/run_test_suite.py repository-contract -b --durations 30
      - name: Full non-commercial suite
        run: uv run python tests/run_test_suite.py all -b --durations 30
  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      GSVIBE_REDIS_URL: redis://127.0.0.1:6379/0
      GSVIBE_REDIS_PREFIX: gsvibe:analysis:v1
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Redis integration tests
        run: uv run python tests/run_test_suite.py redis-integration -b --durations 30
  pages:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - name: Install Pages dependencies
        run: npm ci
      - name: Test Pages application
        run: npm test
      - name: Lint Pages application
        run: npm run lint
      - name: Build Pages artifact
        run: npm run build
      - name: Verify game-symbol assets
        run: npm run verify:gamesymbols
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Pages E2E
        run: npm run test:e2e
