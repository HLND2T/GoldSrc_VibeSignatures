name: Verified private S3 cache
description: Explicit restore/save with required publication verification
inputs:
  endpoint-url:
    description: S3 HTTP(S) origin
    required: true
  access-key:
    description: S3 access key
    required: true
  secret-key:
    description: S3 secret key
    required: true
  operation:
    description: restore or save
    required: true
  key:
    description: Immutable cache key
    required: true
  path:
    description: Cache paths
    required: true
  restore-keys:
    description: Producer discovery prefixes
    default: ''
  required:
    description: Require an exact hit
    default: 'false'
outputs:
  cache-hit:
    description: Exact restore hit
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Parse endpoint
      id: endpoint-windows
      if: ${{ !cancelled() && runner.os == 'Windows' }}
      shell: pwsh
      env:
        S3_ENDPOINT_URL: ${{ inputs.endpoint-url }}
        S3_ACCESS_KEY_ID: ${{ inputs.access-key }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        CACHE_OPERATION: ${{ inputs.operation }}
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        $toolRoot = Join-Path $env:CACHE_ACTION_PATH '../../..'
        uv run --project $toolRoot --locked python (Join-Path $toolRoot 'ci_s3_cache.py') endpoint
        if ($LASTEXITCODE -ne 0) { throw 'Invalid S3 configuration' }
    - name: Parse endpoint on Linux
      id: endpoint-linux
      if: ${{ !cancelled() && runner.os == 'Linux' }}
      shell: bash
      env:
        S3_ENDPOINT_URL: ${{ inputs.endpoint-url }}
        S3_ACCESS_KEY_ID: ${{ inputs.access-key }}
        S3_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        CACHE_OPERATION: ${{ inputs.operation }}
        CACHE_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        uv run --project "$CACHE_ACTION_PATH/../../.." --locked python "$CACHE_ACTION_PATH/../../../ci_s3_cache.py" endpoint
    - name: restore S3 cache
      id: restore
      if: ${{ !cancelled() && (steps.endpoint-windows.outcome == 'success' || steps.endpoint-linux.outcome == 'success') && inputs.operation == 'restore' }}
      uses: hzqst/actions-cache/restore@7128b4f7d510a48d0a4c66363349adf017741df0  # Portable S3 object keys, zstd auto-detection
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        AWS_SESSION_TOKEN: ''
      with:
        endpoint: ${{ steps.endpoint-windows.outputs.endpoint || steps.endpoint-linux.outputs.endpoint }}
        port: ${{ steps.endpoint-windows.outputs.port || steps.endpoint-linux.outputs.port }}
        insecure: ${{ steps.endpoint-windows.outputs.insecure || steps.endpoint-linux.outputs.insecure }}
        accessKey: ${{ inputs.access-key }}
        secretKey: ${{ inputs.secret-key }}
        bucket: actions-cache-goldsrc-vibesignatures
        use-fallback: 'false'
        retry: 'true'
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        restore-keys: ${{ inputs.restore-keys }}
    - name: save S3 cache
      id: save
      if: ${{ !cancelled() && (steps.endpoint-windows.outcome == 'success' || steps.endpoint-linux.outcome == 'success') && inputs.operation == 'save' }}
      uses: hzqst/actions-cache/save@7128b4f7d510a48d0a4c66363349adf017741df0  # Portable S3 object keys, zstd auto-detection
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        AWS_SESSION_TOKEN: ''
      with:
        endpoint: ${{ steps.endpoint-windows.outputs.endpoint || steps.endpoint-linux.outputs.endpoint }}
        port: ${{ steps.endpoint-windows.outputs.port || steps.endpoint-linux.outputs.port }}
        insecure: ${{ steps.endpoint-windows.outputs.insecure || steps.endpoint-linux.outputs.insecure }}
        accessKey: ${{ inputs.access-key }}
        secretKey: ${{ inputs.secret-key }}
        bucket: actions-cache-goldsrc-vibesignatures
        use-fallback: 'false'
        retry: 'true'
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
    - name: saved S3 cache
      id: saved
      if: ${{ !cancelled() && steps.save.outcome == 'success' && inputs.operation == 'save' }}
      uses: hzqst/actions-cache/restore@7128b4f7d510a48d0a4c66363349adf017741df0  # Portable S3 object keys, zstd auto-detection
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.access-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.secret-key }}
        AWS_SESSION_TOKEN: ''
      with:
        endpoint: ${{ steps.endpoint-windows.outputs.endpoint || steps.endpoint-linux.outputs.endpoint }}
        port: ${{ steps.endpoint-windows.outputs.port || steps.endpoint-linux.outputs.port }}
        insecure: ${{ steps.endpoint-windows.outputs.insecure || steps.endpoint-linux.outputs.insecure }}
        accessKey: ${{ inputs.access-key }}
        secretKey: ${{ inputs.secret-key }}
        bucket: actions-cache-goldsrc-vibesignatures
        use-fallback: 'false'
        retry: 'true'
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        lookup-only: 'true'
    - name: Require exact restore or verified publication
      if: >-
        !cancelled() && runner.os == 'Windows' && (
        (inputs.operation == 'restore' && inputs.required == 'true' && steps.restore.outputs.cache-hit != 'true') ||
        (inputs.operation == 'save' && steps.saved.outputs.cache-hit != 'true'))
      shell: pwsh
      run: throw 'Required S3 cache object is unavailable'
    - name: Require exact restore or verified publication on Linux
      if: >-
        !cancelled() && runner.os == 'Linux' && (
        (inputs.operation == 'restore' && inputs.required == 'true' && steps.restore.outputs.cache-hit != 'true') ||
        (inputs.operation == 'save' && steps.saved.outputs.cache-hit != 'true'))
      shell: bash
      run: |-
        echo 'Required S3 cache object is unavailable' >&2
        exit 1
