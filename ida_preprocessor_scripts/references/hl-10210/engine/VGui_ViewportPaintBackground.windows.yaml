  // Source: engine/VGUI_EngineSurface.cpp. Current build brackets rendering with GLFinishHud/GLBeginHud; do not force the older GL_Set2D source body.
  void __cdecl VGui_ViewportPaintBackground(int *extents)
  {
    int old_width; // esi
    int old_x; // edi
    int old_y; // ebx
    BOOL intermission; // esi
    int old_height; // [esp+Ch] [ebp-28h]
    int saved_width; // [esp+10h] [ebp-24h]
    int window_x; // [esp+14h] [ebp-20h] BYREF
    int v8; // [esp+18h] [ebp-1Ch] BYREF
    int *v9[3]; // [esp+1Ch] [ebp-18h] BYREF
    int width; // [esp+28h] [ebp-Ch] BYREF
    int height; // [esp+2Ch] [ebp-8h] BYREF

    v9[0] = extents;
    engdst_ViewportPaintBackground(v9);
    GLFinishHud();
    old_width = glwidth;
    old_x = glx;
    old_y = gly;
    old_height = glheight;
    window_x = 0;
    v8 = 0;
    saved_width = glwidth;
    SDL_GetWindowPosition(*pmainwindow, &window_x, &v8);
    v9[1] = nullptr;
    v9[2] = nullptr;
    if ( VideoMode_IsWindowed() )
      SDL_GetWindowSize(*pmainwindow, &width, &height);
    else
      VideoMode_GetCurrentVideoMode(&width, &height, nullptr);
    glx = *v9[0] - window_x;
    gly = v8 + glheight - v9[0][3];
    glwidth = v9[0][2] - *v9[0];
    glheight = v9[0][3] - v9[0][1];
    SCR_CalcRefdef();
    V_RenderView();
    GLBeginHud();
    if ( cls.state == ca_active && *(_DWORD *)dword_1140DA6C == 2 )
    {
      intermission = cl_intermission == 1;
      AllowFog(0);
      ClientDLL_HudRedraw(intermission);
      AllowFog(1);
      old_width = saved_width;
    }
    if ( !scr_drawloading && (cl_intermission != 1 || key_dest) )
      SCR_DrawConsole();
    SCR_DrawLoading();
    if ( cls.state == ca_active && *(_DWORD *)dword_1140DA6C == 2 )
      Sbar_Draw();
    GLFinishHud();
    glx = old_x;
    gly = old_y;
    glwidth = old_width;
    glheight = old_height;
    SCR_CalcRefdef();
    GLBeginHud();
  }
