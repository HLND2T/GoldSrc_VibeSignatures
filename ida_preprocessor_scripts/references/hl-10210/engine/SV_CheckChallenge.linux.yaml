procedure: |-
  // Issue #326 reference reconstruction: source role corroborated by current call arguments/control flow and HL 10210 Linux peer. netadr ABI verified in current machine code; SvEngine trailing address bytes intentionally opaque.
  int __cdecl SV_CheckChallenge(rcon_netadr_t *adr, int nChallengeValue)
  {
    int v2; // edi
    challenge_t *v3; // ebx

    if ( !adr )
      Sys_Error("SV_CheckChallenge:  Null address\n");
    if ( NET_IsLocalAddress(*adr) )
      return 1;
    v2 = 0;
    while ( 1 )
    {
      v3 = &g_rg_sv_challenges[v2];
      if ( NET_CompareBaseAdr(net_from, v3->adr) )
        break;
      if ( ++v2 == 1024 )
      {
        SV_RejectConnection((netadr_t *)adr, "No challenge for your address.\n");
        return 0;
      }
    }
    if ( nChallengeValue == v3->challenge )
      return 1;
    SV_RejectConnection((netadr_t *)adr, "Bad challenge.\n");
    return 0;
  }
