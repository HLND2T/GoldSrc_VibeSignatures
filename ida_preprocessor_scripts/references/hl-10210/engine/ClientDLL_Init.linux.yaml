  // Source: engine/cdll_int.c:ClientDLL_Init (DWARF decl_line 449; public HLND2T tree is a different revision). ClientDLL_Shutdown, LoadSecureClient, ClientDLL_ClientMoveInit, snprintf/strcpy are inlined. This binary retains the secure Blob client-loading path.
  void __cdecl ClientDLL_Init()
  {
    void *ret; // eax
    char szDllName[512]; // [esp+1Ch] [ebp-210h] BYREF
    unsigned int stack_chk; // [esp+21Ch] [ebp-10h]
  
    stack_chk = __readgsdword(0x14u);
    strcpy(szDllName, "cl_dlls/client.so");
    if ( fClientLoaded )
    {
      Net_APIShutDown();
      SPR_Shutdown();
      if ( cl_funcs.pShutdown )
        cl_funcs.pShutdown();
      if ( cls_fSecureClient )
      {
        FreeBlob((BlobFootprint_t *)&dword_F78240); // target: FreeBlob; g_blobfootprintClient
      }
      else
      {
        MEMORY[0x13D0008](hClientDLL); // dlclose
        hClientDLL = nullptr;
      }
      Q_memset(&cl_funcs, 0, 172);
      Cvar_RemoveHudCvars();
      Cmd_RemoveHudCmds();
      CL_ShutDownUsrMessages();
      fClientLoaded = 0;
      if ( hClientDLL )
        MEMORY[0x13D0008](hClientDLL); // dlclose
      hClientDLL = nullptr;
    }
    COM_FixSlashes(szDllName);
    MEMORY[0x13CFDF8](g_szfullClientName, szDllName, 512); // __strcpy_chk
    COM_ExpandFilename(g_szfullClientName);
    COM_FixSlashes(g_szfullClientName);
    cls_fSecureClient = 0;
    cl_funcs.pInitFunc = (INITIALIZE_FUNC)g_modfuncs;
    cl_funcs.pHudVidInitFunc = (HUD_VIDINIT_FUNC)&g_cldstAddrs;
    ret = NLoadBlobFile(g_szfullClientName, (BlobFootprint_t *)&dword_F78240, &cl_funcs, 1); // dword_F78240 = g_blobfootprintClient
    if ( ret )
    {
      hClientDLL = ret;
      fClientLoaded = 1;
    }
    else if ( !fClientLoaded )
    {
      LoadInsecureClient(g_szfullClientName);
    }
    HookServerMsg("ScreenShake", V_ScreenShake);
    HookServerMsg("ScreenFade", V_ScreenFade);
    cl_funcs.pInitFunc(&cl_enginefuncs, 7); // target: g_ppExportFuncs / g_ppEngfuncs
    if ( cl_funcs.pClientMoveInit )
      cl_funcs.pClientMoveInit((playermove_s *)MEMORY[0xBDEEA0]); // g_clmove
    CL_GetPlayerHulls();
    if ( __readgsdword(0x14u) != stack_chk )
      MEMORY[0x13CFEDC](); // __stack_chk_fail
  }
