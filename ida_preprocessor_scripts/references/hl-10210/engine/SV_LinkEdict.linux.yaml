  void __cdecl SV_LinkEdict(edict_t *ent, int touch_triggers)
  {
    link_s *prev; // eax
    int modelindex; // eax
    int solid; // ecx
    areanode_t *i; // eax
    int axis; // edx
    float *v7; // edx
    link_t *p_area; // edx
    link_s *v9; // eax
    edict_t *aiment; // eax
    int headnode; // edx
    __int16 *leafnums; // eax
    int v13; // eax
    int topnode[4]; // [esp+1Ch] [ebp-10h] BYREF

    prev = ent->area.prev;
    if ( prev )
    {
      ent->area.next->prev = prev;
      ent->area.prev->next = ent->area.next;
      ent->area.next = nullptr;
      ent->area.prev = nullptr;
    }
    if ( ent != (edict_t *)sv.edicts && !ent->free )
    {
      gEntityInterface.pfnSetAbsBox(ent);
      if ( ent->v.movetype == 12 && (aiment = ent->v.aiment) != nullptr )
      {
        headnode = aiment->headnode;
        leafnums = aiment->leafnums;
        ent->headnode = headnode;
        ent->num_leafs = *((_DWORD *)leafnums - 1);
        Q_memcpy(ent->leafnums, leafnums, 96);
      }
      else
      {
        topnode[0] = -1;
        modelindex = ent->v.modelindex;
        ent->num_leafs = 0;
        ent->headnode = -1;
        if ( modelindex )
        {
          SV_FindTouchedLeafs((edict_t_0 *)ent, sv.worldmodel->nodes, topnode);
          if ( ent->num_leafs > 48 )
          {
            v13 = topnode[0];
            ent->num_leafs = 0;
            ent->headnode = v13;
            Q_memset(ent->leafnums, 255, 96);
          }
        }
      }
      solid = ent->v.solid;
      if ( solid )
      {
        if ( solid == 4 && !sv.models[ent->v.modelindex] )
        {
          if ( !Q_strlen(&pr_strings[ent->v.model]) )
          {
            Con_DPrintf("Inserted %s with no model\n", &pr_strings[ent->v.classname]);
            return;
          }
          solid = ent->v.solid;
        }
      }
      else if ( ent->v.skin >= -1 )
      {
        return;
      }
      for ( i = sv_areanodes; ; i = i->children[1] )
      {
        axis = i->axis;
        if ( i->axis == -1 )
          break;
        while ( 1 )
        {
          v7 = (float *)(&ent->free + axis);
          if ( v7[81] <= (long double)i->dist )
            break;
          i = i->children[0];
          axis = i->axis;
          if ( i->axis == -1 )
            goto LABEL_14;
        }
        if ( i->dist <= (long double)v7[84] )
          break;
      }
  LABEL_14:
      p_area = &ent->area;
      if ( solid == 1 )
      {
        ent->area.next = &i->trigger_edicts;
        v9 = i->trigger_edicts.prev;
      }
      else
      {
        ent->area.next = &i->solid_edicts;
        v9 = i->solid_edicts.prev;
      }
      ent->area.prev = v9;
      v9->next = p_area;
      ent->area.next->prev = p_area;
      if ( touch_triggers )
      {
        if ( !iTouchLinkSemaphore_10352 )
        {
          iTouchLinkSemaphore_10352 = 1;
          SV_TouchLinks((edict_t_0 *)ent, sv_areanodes);
          iTouchLinkSemaphore_10352 = 0;
        }
      }
    }
  }
