    {
      data = net_message.data;
      src = &data[Q_strlen("rcon")];
      Q_memcpy(rcon_buff, src, count);
      type = from->type;
      rcon_buff[count] = 0;
      str.type = type;
      *(_DWORD *)str.ip = *(_DWORD *)from->ip;
      *(_DWORD *)str.ipx = *(_DWORD *)from->ipx;
      *(_QWORD *)&str.ipx[4] = *(_QWORD *)&from->ipx[4];
