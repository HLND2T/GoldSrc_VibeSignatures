        Log_Printf("Bad Rcon: \"%s\" from \"%s\"\n", rcon_buff, v15);
        sv_redirected = RD_PACKET;
        sv_redirectto.type = from->type;
        *(_DWORD *)sv_redirectto.ip = *(_DWORD *)from->ip;
        *(_DWORD *)sv_redirectto.ipx = *(_DWORD *)from->ipx;
        *(_DWORD *)&sv_redirectto.ipx[4] = *(_DWORD *)&from->ipx[4];
        v16 = *(_DWORD *)&from->ipx[8];
        outputbuf[0] = 0;
        *(_DWORD *)&sv_redirectto.ipx[8] = v16;
        if ( validation_result == 2 || *rcon_password.string )
          Con_Printf("Bad rcon_password.\n");
        else
          Con_Printf("Bad rcon_password.\nNo password set for this server.\n");
