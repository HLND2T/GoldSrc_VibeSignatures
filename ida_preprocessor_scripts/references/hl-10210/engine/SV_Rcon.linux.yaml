  // Issue #326 Part B reference: verified current input, cdecl ABI and current call/dataflow. Native menu poller retains its dedicated/state guards. Inline filter/parser and authentication/redirect blocks are actual target code; separate retained helpers may be uncalled. Sven netadr trailing bytes are opaque; extra address-format/comparison arguments are target-specific.
  void __cdecl SV_Rcon(rcon_netadr_t *from)
  {
    int v1; // eax
    int cursize; // esi
    int validation_result; // edi
    int count; // esi
