procedure: |-
  void __cdecl CL_ReallocateDynamicData(int nMaxClients)
  {
    cl_max_edicts = COM_EntsForPlayerSlots(nMaxClients);
    if ( cl_max_edicts <= 0 )
      Sys_Error("CL_ReallocateDynamicData allocating 0 entities");
    if ( cl_entities )
      Con_Printf("CL_Reallocate cl_entities\n");
    cl_entities = (cl_entity_t_3 *)Mem_ZeroMalloc(3000 * cl_max_edicts);
    R_AllocObjects(cl_max_edicts);
    Q_memset(cl_frames, 0, 17176 * CL_UPDATE_BACKUP);
  }
