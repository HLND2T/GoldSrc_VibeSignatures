procedure: |-
  // Source: engine/r_studio.c R_StudioRenderModel. Reset chrome origin and forced face flags; in the kRenderFxGlowShell (19) branch temporarily clear renderfx and call R_StudioRenderFinal, select the shell sprite texture, restore renderfx, then render the final pass again. The direct call before SpriteTexture identifies R_StudioRenderFinal; the terminal jump is a second invocation of that same callee.
  void __cdecl R_StudioRenderModel()
  {
    g_ChromeOrigin[2] = r_origin[2];
    *(_QWORD *)g_ChromeOrigin = *(_QWORD *)r_origin;
    g_ForcedFaceFlags = 0;
    if ( currententity->renderfx == 19 )
    {
      currententity->renderfx = 0;
      R_StudioRenderFinal();
      g_ForcedFaceFlags = 2;
      tri_SpriteTexture(cl_sprite_shell, 0);
      currententity->renderfx = 19;
    }
    R_StudioRenderFinal();
  }
