procedure: |-
  // gl_mtexable gates texture-unit selection; oldtarget is the previous unit compared with target and updated after caching bindings.
  void __cdecl GL_SelectTexture(unsigned int target)
  {
    unsigned int v1; // edx

    if ( gl_mtexable )
    {
      qglSelectTextureSGIS(target);
      if ( target != oldtarget )
      {
        v1 = oldtarget - TEXTURE0_SGIS;
        oldtarget = target;
        cnttextures[v1] = currenttexture;
        currenttexture = cnttextures[target - TEXTURE0_SGIS];
      }
    }
  }
