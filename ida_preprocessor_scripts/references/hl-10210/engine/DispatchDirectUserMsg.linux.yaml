procedure: |-
  int __cdecl DispatchDirectUserMsg(const char *pszName, int iSize, void *pBuf)
  {
    int fFound; // esi
    UserMsg *pList; // edi
    int iMsgSize; // eax
    void (__cdecl *pfnRet)(char *, int, void *); // esi
  
    fFound = 0;
    for ( pList = MEMORY[0x4D67E0]; pList; pList = pList->next ) // target: gClientUserMsgs
    {
      if ( !Q_stricmp(pszName, pList->szName) )
      {
        iMsgSize = pList->iSize;
        pfnRet = (void (__cdecl *)(char *, int, void *))pList->pfn;
        if ( iMsgSize == -1 )
          iMsgSize = iSize;
        if ( pfnRet )
        {
          pfnRet(pList->szName, iMsgSize, pBuf);
          fFound = 1;
        }
        else
        {
          fFound = 1;
          Con_DPrintf("UserMsg: No pfn %s %d\n", pList->szName, pList->iMsg);
        }
      }
    }
    return fFound;
  }
