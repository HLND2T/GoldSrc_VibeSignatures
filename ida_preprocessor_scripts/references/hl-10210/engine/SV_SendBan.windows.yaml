procedure: |-
  // net_message is the whole sizebuf object repeatedly passed to SZ_Clear/MSG_Write*. net_from is the whole incoming address copied by value to NET_SendPacket, not a pointer slot or an interior member. Scalar sizebuf_t_data_offset is the current send data-field address minus that object base; sizebuf_t_cursize_offset is the current send length-field address minus the base. This reference has offsets 8/16, each field width 4; independently derive each target offset from its own operands.
  // Issue #326 Part C: current x86 operands verify the whole objects and field accesses. NS_SERVER=1; socket elements are 4 bytes. DLL_CLOSE=3; redirect modes 0/1/2. Sven address trailing bytes remain opaque. Original flush does not prove the reference fork UDP RCON fixes.
  void __cdecl SV_SendBan()
  {
    char Buffer[64]; // [esp+0h] [ebp-44h] BYREF

    Q_snprintf(Buffer, 0x40u, "You have been banned from this server.\n");
    SZ_Clear(&net_message);
    MSG_WriteLong(&net_message, -1);
    MSG_WriteByte(&net_message, 108);
    MSG_WriteString(&net_message, Buffer);
    NET_SendPacket(1, net_message.cursize, net_message.data, net_from); // (structmember, struct=rcon_sizebuf_t, member=data) // (structmember, struct=rcon_sizebuf_t, member=cursize)
    SZ_Clear(&net_message);
  }
