procedure: |-
  // Target hl-10210 PE behavior corroborated by Linux DWARF peer: preserves fClientLoaded guard, compiler-inlined ClientDLL_CheckStudioInterface, and five joystick cvar caches.
  void __cdecl ClientDLL_HudInit()
  {
    HMODULE hClientDLL; // esi

    if ( !cl_funcs.pHudInitFunc )
      Sys_Error(
        "c:\\buildslave\\goldsrc_win32\\build\\GoldSrc\\engine\\cdll_int.c, line %d: could not link client DLL for HUD initialization",
        1126);
    cl_funcs.pHudInitFunc();
    hClientDLL = ::hClientDLL; // target: g_phClientModule
    R_ResetStudio();
    if ( fClientLoaded )
    {
      GetProcAddress(hClientDLL, "HUD_GetStudioModelInterface");
      if ( cl_funcs.pStudioInterface )
      {
        if ( !cl_funcs.pStudioInterface(1, &pStudioAPI, &engine_studio_api) )
        {
          Con_DPrintf("Couldn't get client .dll studio model rendering interface.  Version mismatch?\n");
          R_ResetStudio();
        }
      }
    }
    cl_righthand = Cvar_FindVar("cl_righthand");
    joy_supported = Cvar_FindVar("joysupported");
    joy_forwardsensitivity = Cvar_FindVar("joyforwardsensitivity");
    joy_sidesensitivity = Cvar_FindVar("joysidesensitivity");
    joy_pitchsensitivity = Cvar_FindVar("joypitchsensitivity");
    joy_yawsensitivity = Cvar_FindVar("joyyawsensitivity");
  }
