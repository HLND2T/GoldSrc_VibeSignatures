  void __usercall CBaseUI__Initialize(CBaseUI *this@<eax>, CreateInterfaceFn *factories@<edx>)
  {
    CreateInterfaceFn engineFactory; // ebp
    CreateInterfaceFn fileSystemFactory; // edi
    CSysModule *Module; // eax
    CreateInterfaceFn vguiFactory; // esi
    CSysModule *v7; // eax
    CreateInterfaceFn chromeFactory; // eax
    unsigned int i; // eax
    CSysModule *v10; // eax
    CreateInterfaceFn gameUIFactory; // edi
    ICareerUI *v12; // eax
    CreateInterfaceFn clientDLLFactory; // eax
    int m_iNumFactories; // edx
    int numFactories; // eax
    char szDllName[512]; // [esp+1Ch] [ebp-220h] BYREF
    unsigned int canary; // [esp+21Ch] [ebp-20h]

    canary = __readgsdword(0x14u);
    engineFactory = *factories;
    fileSystemFactory = factories[1];
    fileSystemFactory("VFileSystem009", nullptr);
    Module = Sys_LoadModule("vgui2.so");
    this->m_hVGuiModule = Module;
    vguiFactory = Sys_GetFactory(Module);
    v7 = Sys_LoadModule("chromehtml.so");
    this->m_hChromeModule = v7;
    chromeFactory = Sys_GetFactory(v7);
    this->m_FactoryList[0] = engineFactory;
    this->m_FactoryList[1] = vguiFactory;
    this->m_FactoryList[2] = fileSystemFactory;
    this->m_iNumFactories = 4;
    this->m_FactoryList[3] = chromeFactory;
    for ( i = 0; i < 0x18; i += 4 )
      *(_DWORD *)&szDllName[i] = *(_DWORD *)&aValveClDllsGameuiSo[i];// source uses Q_snprintf('valve/cl_dlls/gameui.so') + COM_ExpandFilename; shipped 10210 copies the 24-byte literal and skips COM_ExpandFilename
    COM_FixSlashes(szDllName);
    FS_GetLocalCopy(szDllName);
    v10 = Sys_LoadModule(szDllName);
    this->m_hStaticGameUIModule = v10;
    gameUIFactory = Sys_GetFactory(v10);
    this->m_FactoryList[this->m_iNumFactories] = gameUIFactory;
    if ( gameUIFactory )
    {
      staticGameUIFuncs = (IGameUI *)gameUIFactory("GameUI007", nullptr);
      staticGameConsole = (IGameConsole *)gameUIFactory("GameConsole003", nullptr);
      v12 = (ICareerUI *)gameUIFactory("CareerUI001", nullptr);// staticCareerUI is commented out in the HLND2T source but active in the shipped binary
      ++this->m_iNumFactories;
      staticCareerUI = v12;
    }
    g_InputInternal = (vgui2::IInputInternal *)vguiFactory("VGUI_InputInternal001", nullptr);
    if ( cl_funcs.pClientFactory )                // target: g_pClientFactory
    {
      clientDLLFactory = Sys_GetFactory((CSysModule *)hClientDLL);// source calls cl_funcs.pClientFactory(); shipped binary uses Sys_GetFactory(hClientDLL)
      if ( clientDLLFactory )
      {
        m_iNumFactories = this->m_iNumFactories;
        this->m_FactoryList[m_iNumFactories] = clientDLLFactory;
        this->m_iNumFactories = m_iNumFactories + 1;
        staticClient = (IClientVGUI *)clientDLLFactory("VClientVGUI001", nullptr);
      }
      numFactories = this->m_iNumFactories;
    }
    else
    {
      numFactories = this->m_iNumFactories;
      this->m_FactoryList[numFactories] = nullptr;
    }
    vgui2::VGuiControls_Init("BaseUI", this->m_FactoryList, numFactories);
  }
