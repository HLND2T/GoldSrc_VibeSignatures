  // Source: engine/cdll_int.c CL_CreateVisibleEntity. type 3 is ET_BEAM; only the other branch owns cl_numvisedicts/cl_visedicts. The current build additionally invokes the engine API interception hook.
  int __cdecl CL_CreateVisibleEntity(int type, void *ent)
  {
    int v2; // ecx
    int v4; // edx

    engdst_CreateVisibleEntity(&type, &ent);
    if ( type == 3 )
    {
      v4 = cl_numbeamentities;
      if ( cl_numbeamentities < 64 )
      {
        cl_beamentities[cl_numbeamentities] = ent;
        cl_numbeamentities = v4 + 1;
        return 1;
      }
    }
    else
    {
      v2 = cl_numvisedicts;
      if ( cl_numvisedicts < 512 )
      {
        cl_visedicts[cl_numvisedicts] = ent;
        cl_numvisedicts = v2 + 1;
        return 1;
      }
    }
    return 0;
  }
