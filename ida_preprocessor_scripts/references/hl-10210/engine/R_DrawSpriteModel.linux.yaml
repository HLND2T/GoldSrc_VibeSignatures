procedure: |-
  void __cdecl R_DrawSpriteModel(cl_entity_t_1 *e)
  {
    msprite_t *data; // ebx
    mspriteframe_t *SpriteFrame; // eax
    mspriteframe_t *v3; // esi
    long double v4; // fst6
    int alpha; // eax
    int rendermode; // eax
    float pEntity; // [esp+4h] [ebp-88h]
    float pEntitya; // [esp+4h] [ebp-88h]
    float pEntityb; // [esp+4h] [ebp-88h]
    float pEntityc; // [esp+4h] [ebp-88h]
    float pEntityd; // [esp+4h] [ebp-88h]
    float pEntitye; // [esp+4h] [ebp-88h]
    float pEntityf; // [esp+4h] [ebp-88h]
    float pEntityg; // [esp+4h] [ebp-88h]
    float scale; // [esp+28h] [ebp-64h]
    float v16; // [esp+2Ch] [ebp-60h]
    float v17; // [esp+2Ch] [ebp-60h]
    float v18; // [esp+2Ch] [ebp-60h]
    vec3_t point; // [esp+30h] [ebp-5Ch] BYREF
    vec3_t forward; // [esp+3Ch] [ebp-50h] BYREF
    vec3_t right; // [esp+48h] [ebp-44h] BYREF
    vec3_t up; // [esp+54h] [ebp-38h] BYREF
    colorVec color; // [esp+60h] [ebp-2Ch] BYREF
  
    data = (msprite_t *)e->model->cache.data;
    SpriteFrame = R_GetSpriteFrame(data, (int)e->curstate.frame);
    if ( !SpriteFrame )
    {
      Sys_Warning("R_DrawSpriteModel:  couldn't get sprite frame for %s\n", e->model->name);
      return;
    }
    v3 = SpriteFrame;
    v4 = 1.0;
    if ( e->curstate.scale > 0.0 )
      v4 = e->curstate.scale;
    scale = v4;
    if ( e->curstate.rendermode )
    {
      v16 = 255.0 * r_blend;
      alpha = (int)v16;
    }
    else
    {
      r_blend = 1.0;
      alpha = 255;
    }
    R_SpriteColor(&color, e, alpha);
    rendermode = e->curstate.rendermode;
    if ( gl_spriteblend.value == 0.0 && !rendermode )
    {
      qglTexEnvf(0x2300u, 0x2200u, 8448.0);
      qglColor4ub(color.r, color.g, color.b, 0xFFu);
      qglDisable(0xBE2u);
      goto LABEL_15;
    }
    switch ( rendermode )
    {
      case 1:
        qglBlendFunc(0x302u, 0x303u);
        qglTexEnvi(0x2300u, 0x2200u, 6406);
        goto LABEL_13;
      case 5:
        qglTexEnvf(0x2300u, 0x2200u, 8448.0);
        qglBlendFunc(1u, 1u);
        qglColor4ub(color.r, color.g, color.b, 0xFFu);
        goto LABEL_21;
      case 3:
        qglTexEnvf(0x2300u, 0x2200u, 8448.0);
        qglBlendFunc(1u, 1u);
        qglColor4ub(color.r, color.g, color.b, 0xFFu);
        qglDisable(0xB71u);
        qglDepthMask(0);
        goto LABEL_14;
      case 4:
        qglTexEnvf(0x2300u, 0x2200u, 8448.0);
        qglBlendFunc(0x302u, 0x303u);
        v18 = 255.0 * r_blend;
        qglColor4ub(color.r, color.g, color.b, (int)v18);
  LABEL_21:
        qglDepthMask(0);
        goto LABEL_14;
    }
    qglTexEnvf(0x2300u, 0x2200u, 8448.0);
    qglBlendFunc(0x302u, 0x303u);
  LABEL_13:
    v17 = 255.0 * r_blend;
    qglColor4ub(color.r, color.g, color.b, (int)v17);
  LABEL_14:
    qglEnable(0xBE2u);
  LABEL_15:
    R_GetSpriteAxes(e, data->type, forward, right, up);
    GL_DisableMultitexture();
    GL_Bind(v3->gl_texturenum);
    qglEnable(0xBC0u);
    qglBegin(7u);
    qglTexCoord2f(0.0, 1.0);
    pEntity = scale * v3->down;
    VectorMA(r_entorigin, pEntity, up, point);
    pEntitya = scale * v3->left;
    VectorMA(point, pEntitya, right, point);
    qglVertex3fv(point);
    qglTexCoord2f(0.0, 0.0);
    pEntityb = scale * v3->up;
    VectorMA(r_entorigin, pEntityb, up, point);
    pEntityc = scale * v3->left;
    VectorMA(point, pEntityc, right, point);
    qglVertex3fv(point);
    qglTexCoord2f(1.0, 0.0);
    pEntityd = scale * v3->up;
    VectorMA(r_entorigin, pEntityd, up, point);
    pEntitye = scale * v3->right;
    VectorMA(point, pEntitye, right, point);
    qglVertex3fv(point);
    qglTexCoord2f(1.0, 1.0);
    pEntityf = scale * v3->down;
    VectorMA(r_entorigin, pEntityf, up, point);
    pEntityg = scale * v3->right;
    VectorMA(point, pEntityg, right, point);
    qglVertex3fv(point);
    qglEnd();
    qglDisable(0xBC0u);
    qglDepthMask(1u);
    if ( e->curstate.rendermode || gl_spriteblend.value != 0.0 )
    {
      qglTexEnvf(0x2300u, 0x2200u, 7681.0);
      qglDisable(0xBE2u);
      qglEnable(0xB71u);
    }
  }
