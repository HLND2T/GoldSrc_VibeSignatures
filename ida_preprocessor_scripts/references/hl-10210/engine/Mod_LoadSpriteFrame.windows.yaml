procedure: |-
  void *__cdecl Mod_LoadSpriteFrame(void *pin, mspriteframe_t **ppframe, int framenum)
  {
    int width; // edi
    int height; // ebx
    int origin0; // esi
    int origin1; // eax
    char *pinframe; // esi
    int textureType; // eax
    int Texture; // eax
    mspriteframe_t *pspriteframe; // [esp+10h] [ebp-40Ch]
    byte bPal[768]; // [esp+18h] [ebp-404h] BYREF
    char name[256]; // [esp+318h] [ebp-104h] BYREF

    Q_memcpy(bPal, pspritepal, 768);
    width = LittleLong(*((_DWORD *)pin + 2));
    height = LittleLong(*((_DWORD *)pin + 3));
    pspriteframe = (mspriteframe_t *)Hunk_AllocName(28, (int)loadname);
    Q_memset(pspriteframe, 0, 28);
    *ppframe = pspriteframe;
    pspriteframe->width = width;
    pspriteframe->height = height;
    origin0 = LittleLong(*(_DWORD *)pin);
    origin1 = LittleLong(*((_DWORD *)pin + 1));
    pspriteframe->up = (float)origin1;
    pspriteframe->down = (float)(origin1 - height);
    pspriteframe->left = (float)origin0;
    pspriteframe->right = (float)(origin0 + width);
    Q_snprintf(name, 0x100u, "%s_%i", (char)loadmodel);
    pinframe = (char *)pin;
    switch ( gSpriteTextureFormat )
    {
      case 0:
      case 1:
        textureType = 0;
        break;
      case 2:
        textureType = 3;
        break;
      case 3:
        textureType = 1;
        break;
      default:
        textureType = width * height;
        break;
    }
    if ( gSpriteMipMap ) // gSpriteMipMap: select the condition's direct global read for found_gv
    {
      Texture = GL_LoadTexture(name, 5, width, height, (byte *)pin + 16, gSpriteMipMap, textureType, bPal);
      pinframe = (char *)pin;
    }
    else
    {
      Texture = GL_LoadTexture(name, 2, width, height, (byte *)pin + 16, 0, textureType, bPal);
    }
    pspriteframe->gl_texturenum = Texture;
    return &pinframe[width * height + 16];
  }
