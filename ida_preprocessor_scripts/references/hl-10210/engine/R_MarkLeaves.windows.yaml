procedure: |-
  // Targets are the two pointer globals themselves, not the pointed-to leaves or ELF GOT slots.
  // Current-binary leaf/PVS marking. Source gl_rsurf.c is semantic evidence, not an exact build. The no-vis same-leaf path may omit a redundant old-leaf assignment.
  void __cdecl R_MarkLeaves()
  {
    model_t *worldmodel; // edi
    int i; // ebx
    int visframe; // esi
    int node; // eax
    unsigned __int8 *vis; // [esp+0h] [ebp-100Ch]
    int leaf_byte_offset; // [esp+4h] [ebp-1008h]
    _BYTE solid[4096]; // [esp+8h] [ebp-1004h] BYREF

    if ( (r_oldviewleaf != r_viewleaf || r_novis_value != 0.0) && !mirror )
    {
      ++r_visframecount;
      r_oldviewleaf = r_viewleaf;
      if ( r_novis_value == 0.0 )
      {
        vis = Mod_LeafPVS(r_viewleaf, cl_worldmodel);
      }
      else
      {
        vis = solid;
        Q_memset(solid, 255, (*(_DWORD *)&cl_worldmodel->_pad_0048[64] + 7) >> 3);
      }
      worldmodel = cl_worldmodel;
      i = 0;
      if ( *(int *)&cl_worldmodel->_pad_0048[64] > 0 )
      {
        visframe = r_visframecount;
        leaf_byte_offset = 0;
        do
        {
          if ( ((unsigned __int8)(1 << (i & 7)) & vis[i >> 3]) != 0 )
          {
            node = leaf_byte_offset + 60 + *(_DWORD *)&worldmodel->_pad_0048[68];
            do
            {
              if ( *(_DWORD *)(node + 4) == visframe )
                break;
              *(_DWORD *)(node + 4) = visframe;
              node = *(_DWORD *)(node + 32);
              visframe = r_visframecount;
            }
            while ( node );
            worldmodel = cl_worldmodel;
          }
          leaf_byte_offset += 60;
          ++i;
        }
        while ( i < *(_DWORD *)&worldmodel->_pad_0048[64] );
      }
    }
  }
