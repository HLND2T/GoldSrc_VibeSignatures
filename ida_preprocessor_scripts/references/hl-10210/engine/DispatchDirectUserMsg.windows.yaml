procedure: |-
  int __cdecl DispatchDirectUserMsg(const char *pszName, int iSize, void *pBuf)
  {
    UserMsg *pList; // esi
    int fFound; // ebx
    void (__cdecl *pfnRet)(char *, int, void *); // ecx
    int iMsgSize; // eax
  
    pList = gClientUserMsgs; // target: gClientUserMsgs
    for ( fFound = 0; pList; pList = pList->next )
    {
      if ( !Q_strcasecmp(pszName, pList->szName) )
      {
        pfnRet = (void (__cdecl *)(char *, int, void *))pList->pfn;
        fFound = 1;
        iMsgSize = pList->iSize;
        if ( iMsgSize == -1 )
          iMsgSize = iSize;
        if ( pfnRet )
          pfnRet(pList->szName, iMsgSize, pBuf);
        else
          Con_DPrintf("UserMsg: No pfn %s %d\n", pList->szName, pList->iMsg);
      }
    }
    return fFound;
  }
