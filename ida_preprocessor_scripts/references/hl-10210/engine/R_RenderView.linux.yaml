procedure: |-
  void __cdecl R_RenderView()
  {
    long double v0; // fst7
    long double v1; // fst7
    long double v2; // fst7
    double time1; // [esp+20h] [ebp-1Ch]
    float v4; // [esp+28h] [ebp-14h]
    float framerate; // [esp+2Ch] [ebp-10h]

    if ( r_norefresh.value != 0.0 )
      return;
    if ( !r_worldentity.model || !nMax.worldmodel )
      Sys_Error("R_RenderView: NULL worldmodel");
    if ( r_speeds.value != 0.0 )
    {
      qglFinish();
      v2 = Sys_FloatTime();
      c_brush_polys = 0; // renderer brush polygon counter
      c_alias_polys = 0; // renderer alias polygon counter
      time1 = v2;
    }
    mirror = false;
    R_Clear();
    if ( r_refdef.onlyClientDraws )
    {
      R_RenderScene();
      if ( r_refdef.onlyClientDraws )
        goto LABEL_8;
      goto LABEL_13;
    }
    R_PreDrawViewModel();
    R_RenderScene();
    if ( r_refdef.onlyClientDraws == false )
    {
  LABEL_13:
      R_DrawViewModel();
      R_PolyBlend();
    }
  LABEL_8:
    S_ExtraUpdate();
    if ( r_speeds.value != 0.0 )
    {
      framerate = nMax.time - nMax.oldtime;
      v0 = framerate;
      if ( framerate > 0.0 )
        v0 = 1.0 / v0;
      v4 = v0;
      v1 = Sys_FloatTime();
      Con_Printf(
        "%3ifps %3i ms  %4i wpoly %4i epoly\n",
        (int)(double)(v4 + 0.5),
        (int)(double)((v1 - time1) * 1000.0),
        c_brush_polys,
        c_alias_polys);
    }
  }
