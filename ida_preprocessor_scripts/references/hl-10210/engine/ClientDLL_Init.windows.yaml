procedure: |-
  // source/binary mismatch: public ClientDLL_Shutdown is a separate function; this build inlines its body. Public LoadSecureClient is stubbed to return false; this build still calls NLoadBlobFile. Public source sets cls.fSecureClient=true first; this binary writes 0 and never sets it true. Extra FreeLibrary after fClientLoaded=0 is not in the public shutdown. Windows-only: Q_strcasecmp(com_gamedir, "ts") then AddVectoredExceptionHandler.
  void __cdecl ClientDLL_Init()
  {
    int i; // ecx
    char ch; // al
    void *ret; // eax
    char szDllName[512]; // [esp+0h] [ebp-204h] BYREF
  
    Q_snprintf(szDllName, 0x200u, "cl_dlls\\client.dll");
    if ( fClientLoaded )
    {
      Net_APIShutDown();
      SPR_Shutdown();
      if ( cl_funcs.pShutdown )
        cl_funcs.pShutdown();
      if ( cls_fSecureClient )
      {
        FreeBlob(&g_blobfootprintClient); // target: FreeBlob
      }
      else
      {
        FreeLibrary((HMODULE)hClientDLL);
        hClientDLL = nullptr;
      }
      Q_memset(&cl_funcs, 0, 172);
      Cvar_RemoveHudCvars();
      Cmd_RemoveHudCmds();
      CL_ShutDownUsrMessages();
      fClientLoaded = 0;
      if ( hClientDLL )
        FreeLibrary((HMODULE)hClientDLL);
      hClientDLL = nullptr;
    }
    if ( !Q_strcasecmp(com_gamedir, "ts") )
      AddVectoredExceptionHandler(1u, Handler);
    COM_FixSlashes(szDllName);
    i = 0;
    do
    {
      ch = szDllName[i++];
      *((_BYTE *)&g_blobfootprintClient.m_hDll + i + 3) = ch;
    }
    while ( ch );
    COM_ExpandFilename(g_szfullClientName);
    COM_FixSlashes(g_szfullClientName);
    cls_fSecureClient = 0;
    cl_funcs.pInitFunc = (INITIALIZE_FUNC)g_modfuncs;
    cl_funcs.pHudVidInitFunc = g_cldstAddrs;
    ret = NLoadBlobFile(g_szfullClientName, &g_blobfootprintClient, &cl_funcs, 1);
    if ( ret )
    {
      hClientDLL = ret;
      fClientLoaded = 1;
    }
    else if ( !fClientLoaded )
    {
      LoadInsecureClient(g_szfullClientName);
    }
    HookServerMsg("ScreenShake", V_ScreenShake);
    HookServerMsg("ScreenFade", V_ScreenFade);
    cl_funcs.pInitFunc(cl_enginefuncs, 7); // target: g_ppExportFuncs / cl_enginefuncs
    if ( cl_funcs.pClientMoveInit )
      cl_funcs.pClientMoveInit(g_clmove);
    CL_GetPlayerHulls();
  }
