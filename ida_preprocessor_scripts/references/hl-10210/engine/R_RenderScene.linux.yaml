procedure: |-
  void __cdecl R_RenderScene()
  {
    if ( CL_IsDevOverviewMode() )
      CL_SetDevOverView(&r_refdef);
    R_SetupFrame();
    R_SetFrustum();
    R_SetupGL();
    R_MarkLeaves();
    if ( r_refdef.onlyClientDraws == false )
    {
      if ( CL_IsDevOverviewMode() )
      {
        qglClearColor(0.0, 1.0, 0.0, 0.0);
        qglClear(0x4000u);
      }
      R_DrawWorld();
      S_ExtraUpdate();
      if ( r_drawentities.value != 0.0 )
        R_DrawEntitiesOnList_0();
    }
    if ( g_bUserFogOn )
      R_RenderFinalFog();
    isFogEnabled_26640 = qglIsEnabled(0xB60u);
    if ( isFogEnabled_26640 == 1 )
    {
      R_SetFogEnabled(false);
      ClientDLL_DrawNormalTriangles();
      if ( isFogEnabled_26640 != 1 )
        goto LABEL_8;
    }
    else
    {
      ClientDLL_DrawNormalTriangles();
      if ( isFogEnabled_26640 != 1 )
        goto LABEL_8;
    }
    R_SetFogEnabled(true);
  LABEL_8:
    if ( nMax.waterlevel > 2 && r_refdef.onlyClientDraws == false || !g_bUserFogOn )
      R_SetFogEnabled(false);
    R_DrawTEntitiesOnList(r_refdef.onlyClientDraws);
    S_ExtraUpdate();
    if ( r_refdef.onlyClientDraws == false )
    {
      R_RenderDlights();
      GL_DisableMultitexture();
      R_DrawParticles();
    }
  }
