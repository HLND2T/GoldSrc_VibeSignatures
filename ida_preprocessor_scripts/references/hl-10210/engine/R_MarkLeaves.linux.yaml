procedure: |-
  // Targets are the two pointer globals themselves, not the pointed-to leaves or ELF GOT slots.
  // Current-binary leaf/PVS marking. Source gl_rsurf.c is semantic evidence, not an exact build. The no-vis same-leaf path may omit a redundant old-leaf assignment.
  void __cdecl R_MarkLeaves()
  {
    model_s *worldmodel; // edi
    int numleafs; // ebp
    int visframe; // eax
    int leaf_index; // esi
    int i; // edx
    mleaf_t *node; // ecx
    byte *vis; // [esp+1Ch] [ebp-1030h]
    byte solid[4096]; // [esp+2Ch] [ebp-1020h] BYREF
    unsigned int stack_cookie; // [esp+102Ch] [ebp-20h]

    stack_cookie = __readgsdword(0x14u);
    if ( r_oldviewleaf == r_viewleaf )
    {
      if ( r_novis.value == 0.0 || mirror )
        return;
      ++r_visframecount;
    }
    else
    {
      if ( mirror )
        return;
      ++r_visframecount;
      r_oldviewleaf = r_viewleaf;
      if ( r_novis.value == 0.0 )
      {
        vis = Mod_LeafPVS(r_viewleaf, nMax.worldmodel);
        goto LABEL_5;
      }
    }
    Q_memset(solid, 255, (nMax.worldmodel->numleafs + 7) >> 3);
    vis = solid;
  LABEL_5:
    worldmodel = nMax.worldmodel;
    numleafs = nMax.worldmodel->numleafs;
    if ( numleafs > 0 )
    {
      visframe = r_visframecount;
      leaf_index = 1;
      for ( i = 0; i < numleafs; ++i )
      {
        if ( (((int)vis[i >> 3] >> (i & 7)) & 1) != 0 )
        {
          node = &worldmodel->leafs[leaf_index];
          do
          {
            if ( node->visframe == visframe )
              break;
            node->visframe = visframe;
            node = (mleaf_t *)node->parent;
          }
          while ( node );
          worldmodel = nMax.worldmodel;
          numleafs = nMax.worldmodel->numleafs;
        }
        ++leaf_index;
      }
    }
  }
