procedure: |-
  // gl_extensions is the pointer STORAGE written with glGetString(GL_EXTENSIONS=0x1F03), then read for extension checks/reporting. Do not return the string pointee or qglGetString slot.
  // Current binary is authoritative. HLND2T_official is a semantic reference, not this exact source revision. Preserve platform-specific SDL/WGL, AA mode and frame-pacing paths.
  void __cdecl GL_Init()
  {
    const char *String; // eax
    const char *v1; // eax
    const char *v2; // eax
    const char *v3; // eax
    const char *v4; // eax
    const char *v5; // eax
    const char *Error; // eax
    int r; // [esp+2Ch] [ebp-20h] BYREF
    int g; // [esp+30h] [ebp-1Ch] BYREF
    int b; // [esp+34h] [ebp-18h] BYREF
    int a; // [esp+38h] [ebp-14h] BYREF
    int depth[4]; // [esp+3Ch] [ebp-10h] BYREF

    String = (const char *)qglGetString(0x1F00u);
    gl_vendor = String;
    if ( !String )
      Sys_Error("Failed to query gl vendor string");
    Con_DPrintf("GL_VENDOR: %s\n", String);
    gl_renderer = (const char *)qglGetString(0x1F01u);
    Con_DPrintf("GL_RENDERER: %s\n", gl_renderer);
    gl_version = (const char *)qglGetString(0x1F02u);
    Con_DPrintf("GL_VERSION: %s\n", gl_version);
    v1 = (const char *)qglGetString(0x1F03u);
    g_bSupportsNPOTTextures = false;
    gl_extensions = v1;
    if ( COM_CheckParm("-glext") )
      Con_DPrintf("GL_EXTENSIONS: %s\n", gl_extensions);
    if ( SDL_GL_GetAttribute(0, &r) )
    {
      Error = (const char *)SDL_GetError();
      r = 0;
      Con_DPrintf("Failed to get GL RED size (%s)\n", Error);
    }
    if ( SDL_GL_GetAttribute(1, &g) )
    {
      v5 = (const char *)SDL_GetError();
      g = 0;
      Con_DPrintf("Failed to get GL GREEN size (%s)\n", v5);
    }
    if ( SDL_GL_GetAttribute(2, &b) )
    {
      v4 = (const char *)SDL_GetError();
      b = 0;
      Con_DPrintf("Failed to get GL BLUE size (%s)\n", v4);
    }
    if ( SDL_GL_GetAttribute(3, &a) )
    {
      v3 = (const char *)SDL_GetError();
      a = 0;
      Con_DPrintf("Failed to get GL ALPHA size (%s)\n", v3);
    }
    if ( SDL_GL_GetAttribute(6, depth) )
    {
      v2 = (const char *)SDL_GetError();
      depth[0] = 0;
      Con_DPrintf("Failed to get GL DEPTH size (%s)\n", v2);
    }
    Con_DPrintf("GL_SIZES:  r:%d g:%d b:%d a:%d depth:%d\n", r, g, b, a, depth[0]);
    CheckTextureExtensions();
    CheckMultiTextureExtensions();
    atismoothing = false;
    if ( gl_extensions && Q_strstr(gl_extensions, "GL_ARB_texture_non_power_of_two") )
      g_bSupportsNPOTTextures = true;
    qglClearColor(1.0, 0.0, 0.0, 0.0);
    qglCullFace(0x404u);
    qglEnable(0xDE1u);
    qglEnable(0xBC0u);
    qglAlphaFunc(0x205u, 0.0);
    qglPolygonMode(0x408u, 0x1B02u);
    qglShadeModel(0x1D00u);
    qglTexParameterf(0xDE1u, 0x2801u, 9728.0);
    qglTexParameterf(0xDE1u, 0x2800u, 9728.0);
    qglTexParameterf(0xDE1u, 0x2802u, 10497.0);
    qglTexParameterf(0xDE1u, 0x2803u, 10497.0);
    qglTexParameterf(0xDE1u, 0x84FEu, gl_ansio.value);
    qglBlendFunc(0x302u, 0x303u);
    qglTexEnvf(0x2300u, 0x2200u, 7681.0);
    GL_Config();
  }
