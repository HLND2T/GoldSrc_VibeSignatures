      {
        if ( v5->needload == NL_UNREFERENCED )
        {
          if ( !v3 || (type = v5->type, type != mod_alias) && type != mod_studio )
            v3 = v5;
        }
        v4 = mod_numknown;
        ++v6;
        v2 = name;
        ++v5;
        if ( v6 >= mod_numknown )
          goto LABEL_13;
      }
      v4 = mod_numknown;
    }
  LABEL_13:
