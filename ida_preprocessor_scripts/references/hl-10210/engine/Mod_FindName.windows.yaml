        Sys_Error("mod_numknown >= MAX_KNOWN_MODELS");
      v5 = v3;
      v8 = v3 - mod_known;
    }
    mod_known_info[v8].initialCRC = 0;
    mod_known_info[v8].firstCRCDone = 0;
    mod_known_info[v8].shouldCRC = trackCRC;
    Q_strncpy(v5, name, 63);
    v5->name[63] = 0;
    result = v5;
    if ( v5->needload != NL_CLIENT )
      v5->needload = NL_NEEDS_LOADED;
