procedure: |-
  // Source role: engine/cl_parse.c CL_ReallocateDynamicData. hl-10210 Windows uses a 3000-byte entity stride and a runtime frame reset count; retain this binary layout instead of imposing the source build's constants.
  void __cdecl CL_ReallocateDynamicData(int nMaxClients)
  {
    int max_edicts; // eax

    max_edicts = COM_EntsForPlayerSlots(nMaxClients);
    cl_max_edicts = max_edicts;
    if ( max_edicts <= 0 )
      Sys_Error("CL_ReallocateDynamicData allocating 0 entities");
    if ( cl_entities )
    {
      Con_Printf("CL_Reallocate cl_entities\n");
      max_edicts = cl_max_edicts;
    }
    cl_entities = Mem_ZeroMalloc(3000 * max_edicts);
    R_AllocObjects(cl_max_edicts);
    Q_memset(&cl_frames, 0, 17176 * dword_1031A22C);
  }
