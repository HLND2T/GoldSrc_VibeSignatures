procedure: |-
  // Alternative name is 'SCR_UpdateScreen.part.2'
  void SCR_UpdateScreen_0()
  {
    double fCurrentTime; // [esp+18h] [ebp-24h]
    float v1; // [esp+2Ch] [ebp-10h]
  
    fCurrentTime = Sys_FloatTime();
    if ( ((unsigned int)(cls.state - 2) <= 1 || cls.state == ca_active)
      && g_LastScreenUpdateTime > 0.0
      && fCurrentTime - g_LastScreenUpdateTime > 120.0 )
    {
      Con_Printf("load failed.\n");
      COM_ExplainDisconnection(true, "Connection to server lost during level change.");
      CL_Disconnect();
    }
    if ( g_modfuncs.m_pfnFrameRender1 )
      g_modfuncs.m_pfnFrameRender1();
    V_UpdatePalette();
    GL_BeginRendering(&glx, &gly, &glwidth, &glheight);
    if ( vid.recalc_refdef )
      SCR_CalcRefdef();
    Con_CheckResize();
    GLBeginHud();
    if ( r_refdef.vrect.x > 0 )
    {
      Draw_TileClear(0, 0, r_refdef.vrect.x, 152);
      Draw_TileClear(r_refdef.vrect.x + r_refdef.vrect.width, 0, r_refdef.vrect.width - r_refdef.vrect.x + 320, 152);
    }
    if ( r_refdef.vrect.height <= 151 )
    {
      Draw_TileClear(r_refdef.vrect.x, 0, r_refdef.vrect.width, r_refdef.vrect.y);
      Draw_TileClear(
        r_refdef.vrect.x,
        r_refdef.vrect.y + r_refdef.vrect.height,
        r_refdef.vrect.width,
        152 - (r_refdef.vrect.y + r_refdef.vrect.height));
    }
    if ( scr_drawloading == false )
    {
      if ( nMax.intermission == 1 )
      {
        if ( key_dest == key_game )
          goto LABEL_20;
        goto LABEL_16;
      }
      if ( nMax.intermission != 2 && nMax.intermission != 3 || key_dest )
      {
  LABEL_16:
        GL_Bind(r_notexture_mip->anim_total);
        if ( (long double)_mm_cvtsi32_si128(vid.height).m128i_i64[0] > scr_con_current )
          Sbar_Draw();
        if ( developer.value != 0.0 )
        {
          GL_Bind(r_notexture_mip->anim_total);
          Con_DrawNotify();
        }
        goto LABEL_20;
      }
      scr_copytop = 1;
      if ( scr_center_lines > scr_erase_lines )
        scr_erase_lines = scr_center_lines;
      scr_centertime_off = scr_centertime_off - host_frametime;
      SCR_DrawCenterString();
    }
  LABEL_20:
    SCR_ConnectMsg();
    VGui_Paint();
    GL_Finish2D();
    GLBeginHud();
    SCR_DrawFPS();
    SCR_NetGraph();
    if ( !VGuiWrap2_IsGameUIVisible() )
    {
      if ( scr_showpause.value != 0.0
        && nMax.paused
        && !VGuiWrap2_IsGameUIVisible()
        && (!g_bIsCZeroRitual
         || !gGlobalVariables.mapname
         || !pr_strings
         || Q_stricmp(&pr_strings[gGlobalVariables.mapname], aCzWorld)) )
      {
        Draw_Pic(glwidth / 2 - scr_paused->width / 2, glheight / 2 - scr_paused->height / 2, scr_paused);
      }
      scr_copytop = 1;
      if ( scr_center_lines > scr_erase_lines )
        scr_erase_lines = scr_center_lines;
      v1 = scr_centertime_off - host_frametime;
      scr_centertime_off = v1;
      if ( (v1 > 0.0 || nMax.intermission) && key_dest == key_game )
        SCR_DrawCenterString();
    }
    GL_Finish2D();
    if ( g_modfuncs.m_pfnFrameRender2 )
      g_modfuncs.m_pfnFrameRender2();
    GL_EndRendering();
    recursionGuard_25173 = false;
    g_LastScreenUpdateTime = fCurrentTime;
  }
