procedure: |-
  void __cdecl vgui2::RichText::InsertString(vgui2::RichText *self, const char *text)
  {
    size_t textLength; // eax
    void *unicodeAllocation; // esp
    vgui2::ILocalize *converter; // eax
    vgui2::ILocalize *localizer; // eax
    const wchar_t *localizedText; // eax
    wchar_t unicode[3]; // [esp+10h] [ebp-38h] BYREF
    int unicodeBytes; // [esp+1Ch] [ebp-2Ch]
    unsigned int stackCanary; // [esp+2Ch] [ebp-1Ch]

    stackCanary = __readgsdword(0x14u);
    if ( *text == 35
      && (localizer = vgui2::localize(),
          (localizedText = (const wchar_t *)(*(int (__cdecl **)(vgui2::ILocalize *, const char *))(*(_DWORD *)localizer
                                                                                                 + 16))(
                                              localizer,
                                              text)) != nullptr) )
    {
      GameUI_RichText_InsertStringW(self, localizedText); // vgui2::RichText::InsertString(wchar_t const*)
    }
    else
    {
      textLength = strlen(text);
      unicodeAllocation = alloca(4 * textLength + 19);
      unicodeBytes = 4 * textLength + 4;
      converter = vgui2::localize();
      (*(void (__cdecl **)(vgui2::ILocalize *, const char *, wchar_t *, int))(*(_DWORD *)converter + 20))(
        converter,
        text,
        unicode,
        unicodeBytes);
      GameUI_RichText_InsertStringW(self, unicode); // same wide overload after ANSI conversion
    }
  }
