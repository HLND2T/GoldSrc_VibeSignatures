    void *unicodeAllocation; // esp
    void *converter; // eax
    unsigned __int16 unicode[6]; // [esp+0h] [ebp-14h] BYREF
    void *selfa; // [esp+Ch] [ebp-8h]

    isLocalizationToken = *text == 35;
    selfa = self;
    if ( isLocalizationToken
      && (localizer = vgui2_localize(),
          (localizedText = (const unsigned __int16 *)(*(int (__thiscall **)(void *, const char *))(*(_DWORD *)localizer
                                                                                                 + 12))(
                                                       localizer,
                                                       text)) != nullptr) )
    {
      GameUI_RichText_InsertStringW(self, localizedText); // vgui2::RichText::InsertString(wchar_t const*)
    }
    else
    {
      unicodeBytes = 2 * strlen(text) + 2;
      unicodeAllocation = alloca(unicodeBytes);
      converter = vgui2_localize();
      (*(void (__thiscall **)(void *, const char *, unsigned __int16 *, int))(*(_DWORD *)converter + 16))(
        converter,
        text,
        unicode,
        unicodeBytes);
      GameUI_RichText_InsertStringW(selfa, unicode); // same wide overload after ANSI conversion
    }
  }
