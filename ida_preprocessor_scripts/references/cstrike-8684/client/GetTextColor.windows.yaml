procedure: |-
  // Issue 259: actual CS client body, corroborated by ELF names and cl_dll/saytext.cpp. Target gv g_LocationColor is the float[3] array selected by text color 4; color 3 is the player team color and must not be selected. Unknown private layouts remain neutral.
  float *__cdecl GetTextColor(int colorNum, int clientIndex)
  {
    if ( colorNum == 3 )
      return GetClientColor(clientIndex);
    if ( colorNum == 4 )
      return g_LocationColor;
    return nullptr;
  }
