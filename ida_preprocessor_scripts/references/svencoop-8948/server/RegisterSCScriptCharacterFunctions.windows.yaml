  // Direct CASDocumentation calls below identify method entries. SDK virtual calls and registered callback pointers are distinct.
  // Descriptive Windows helper name: owns bool isalnum(char character); Linux emits these registrations inside RegisterSCScriptVarious.
  void __cdecl RegisterSCScriptCharacterFunctions(CASDocumentationReference *documentation)
  {
    ASFunctionPointerReference *v1; // eax
    ASFunctionPointerReference *v2; // eax
    ASFunctionPointerReference *v3; // eax
    ASFunctionPointerReference *v4; // eax
    ASFunctionPointerReference *v5; // eax
    ASFunctionPointerReference *v6; // eax
    ASFunctionPointerReference *v7; // eax
    ASFunctionPointerReference *v8; // eax
    ASFunctionPointerReference *v9; // eax
    ASFunctionPointerReference *v10; // eax
    ASFunctionPointerReference *v11; // eax
    ASFunctionPointerReference *v12; // eax
    ASFunctionPointerReference *v13; // eax
    ASFunctionPointerReference storage; // [esp+4h] [ebp-2Ch] BYREF

    v1 = asFunctionPtr(&storage, ScriptChar_isalnum);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is alphanumeric.",
      "bool isalnum(char character)",
      v1,
      0,
      nullptr);
    v2 = asFunctionPtr(&storage, ScriptChar_isalpha);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is alphabetic.",
      "bool isalpha(char character)",
      v2,
      0,
      nullptr);
    v3 = asFunctionPtr(&storage, ScriptChar_iscntrl);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is control.",
      "bool iscntrl(char character)",
      v3,
      0,
      nullptr);
    v4 = asFunctionPtr(&storage, ScriptChar_isdigit);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is a decimal digit character.",
      "bool isdigit(char character)",
      v4,
      0,
      nullptr);
    v5 = asFunctionPtr(&storage, ScriptChar_isgraph);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is graph.",
      "bool isgraph(char character)",
      v5,
      0,
      nullptr);
    v6 = asFunctionPtr(&storage, ScriptChar_islower);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is lower.",
      "bool islower(char character)",
      v6,
      0,
      nullptr);
    v7 = asFunctionPtr(&storage, ScriptChar_isprint);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is print.",
      "bool isprint(char character)",
      v7,
      0,
      nullptr);
    v8 = asFunctionPtr(&storage, ScriptChar_ispunct);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is punctuality.",
      "bool ispunct(char character)",
      v8,
      0,
      nullptr);
    v9 = asFunctionPtr(&storage, ScriptChar_isspace);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is space.",
      "bool isspace(char character)",
      v9,
      0,
      nullptr);
    v10 = asFunctionPtr(&storage, ScriptChar_isupper);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is upper.",
      "bool isupper(char character)",
      v10,
      0,
      nullptr);
    v11 = asFunctionPtr(&storage, ScriptChar_isxdigit);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Returns whether character is a hexadecimal numeric character.",
      "bool isxdigit(char character)",
      v11,
      0,
      nullptr);
    v12 = asFunctionPtr(&storage, ScriptChar_tolower);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Converts the given character to lower case.",
      "char tolower(char character)",
      v12,
      0,
      nullptr);
    v13 = asFunctionPtr(&storage, ScriptChar_toupper);
    CASDocumentation_RegisterGlobalFunction(
      documentation,
      "Converts the given character to upper case.",
      "char toupper(char character)",
      v13,
      0,
      nullptr);
  }
