  // gmodinfo_vertical_fov (gv): address of gmodinfo.vertical_fov, a four-byte boolean field, not an independent ELF symbol or FOV angle.
  // Select the field read that chooses the vertical/horizontal projection calculation, not gmodinfo or a GOT pointer to it.
  // The liblist.gam vertical_fov boolean write independently confirms this field. Derive its address from the current binary, never copy the reference offset.
  // SvEngine differs from the public GoldSrc body: FOV projection selection is inlined or delegated, and matrix multiplication may be vectorized.
  // PIC/GOT accesses require current-target address propagation and gv_pic_addend; the encoded displacement alone is not the global address.
