procedure: |-
  // Targets are the two pointer globals themselves, not the pointed-to leaves or ELF GOT slots.
  // Current-binary leaf/PVS marking. Source gl_rsurf.c is semantic evidence, not an exact build. SvEngine omits the GoldSrc mirror early return.
  void __cdecl R_MarkLeaves()
  {
    int worldmodel; // edi
    int numleafs; // ebp
    int visframe; // eax
    int i; // edx
    int leaf_byte_offset; // esi
    int node; // ecx
    _BYTE *vis; // [esp+18h] [ebp-1024h]
    _BYTE solid[4124]; // [esp+20h] [ebp-101Ch] BYREF

    if ( r_oldviewleaf == r_viewleaf )
    {
      if ( r_novis_value == 0.0 )
        return;
      ++r_visframecount;
    }
    else
    {
      r_oldviewleaf = r_viewleaf;
      ++r_visframecount;
      if ( r_novis_value == 0.0 )
      {
        vis = (_BYTE *)Mod_LeafPVS(r_viewleaf, cl_worldmodel);
        goto LABEL_4;
      }
    }
    Q_memset(solid, 255, (*(_DWORD *)(cl_worldmodel + 136) + 7) >> 3);
    vis = solid;
  LABEL_4:
    worldmodel = cl_worldmodel;
    numleafs = *(_DWORD *)(cl_worldmodel + 136);
    if ( numleafs > 0 )
    {
      visframe = r_visframecount;
      i = 0;
      leaf_byte_offset = 60;
      do
      {
        if ( (((int)(unsigned __int8)vis[i >> 3] >> (i & 7)) & 1) != 0 )
        {
          node = leaf_byte_offset + *(_DWORD *)(worldmodel + 140);
          do
          {
            if ( *(_DWORD *)(node + 4) == visframe )
              break;
            *(_DWORD *)(node + 4) = visframe;
            node = *(_DWORD *)(node + 32);
          }
          while ( node );
          worldmodel = cl_worldmodel;
          numleafs = *(_DWORD *)(cl_worldmodel + 136);
        }
        ++i;
        leaf_byte_offset += 60;
      }
      while ( i < numleafs );
    }
  }
