  // Source: engine/cdll_int.c:ClientDLL_Shutdown.
  // Public leak comments out FreeBlob(&g_blobfootprintClient); this binary keeps that call.
  // Extra trailing FreeLibrary(hClientDLL) is not in the public source revision.
  HMODULE ClientDLL_Shutdown()
  {
    HMODULE result; // eax

    Net_APIShutDown();
    SPR_Shutdown();
    if ( cl_funcs.pShutdown )
      cl_funcs.pShutdown();
    if ( cls_fSecureClient )
    {
      FreeBlob(&g_blobfootprintClient); // target: FreeBlob
    }
    else
    {
      FreeLibrary(hClientDLL);
      hClientDLL = nullptr;
    }
    Q_memset(&cl_funcs, 0, 172);
    Cvar_RemoveHudCvars();
    Cmd_RemoveHudCmds();
    CL_ShutDownUsrMessages();
    result = hClientDLL;
    fClientLoaded = 0;
    if ( hClientDLL )
      result = (HMODULE)FreeLibrary(hClientDLL);
    hClientDLL = nullptr;
    return result;
  }
