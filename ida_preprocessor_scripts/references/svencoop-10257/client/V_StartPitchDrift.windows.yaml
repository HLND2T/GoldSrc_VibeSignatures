  // Source: cl_dll/view.cpp:241-264. g_pitchdrift is the g_pitchdrift object requested by BulletPhysics. Select pitchvel (offset zero) to recover its base. Current ABI laststop offset is 16 (Windows).
  void __cdecl V_StartPitchDrift()
  {
    if ( g_pitchdrift.laststop != gEngfuncs_GetClientTime() && (g_pitchdrift.nodrift || g_pitchdrift.pitchvel == 0.0) )
    {
      g_pitchdrift.nodrift = 0;
      g_pitchdrift.driftmove = 0.0;
      g_pitchdrift.pitchvel = v_centerspeed->value;
    }
  }
