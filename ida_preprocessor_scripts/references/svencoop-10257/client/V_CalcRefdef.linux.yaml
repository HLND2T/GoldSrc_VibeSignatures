procedure: |-
  // Source context: cl_dll/view.cpp V_CalcRefdef and common/ref_params.h. Sven extends this entry with a nextView/global portal-pass guard. g_bRenderingPortals_SCClient (requested g_bRenderingPortals_SCClient) suppresses normal/intermission view recalculation during the portal pass; the portal renderer sets it to true around rendering and clears it afterward. Windows inlines intermission calculation; Linux retains its direct call.
  void __cdecl V_CalcRefdef(ref_params_sven_prefix *pparams)
  {
    g_iWaterLevel = pparams->waterlevel;
    if ( !pparams->nextView && !g_bRenderingPortals_SCClient )
    {
      pparams->onlyClientDraw = 0;
      if ( pparams->intermission )
      {
        V_CalcIntermissionRefdef(pparams);
      }
      else if ( !pparams->paused )
      {
        V_CalcNormalRefdef(pparams);
      }
    }
    pparams->nextView = 0;
    View_AngleVectors(pparams->viewangles, pparams->forward, pparams->right, pparams->up);
  }
