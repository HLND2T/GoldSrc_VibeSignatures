  // Static CASEntityFuncs::InitializeEntity(const CString&, CBaseEntity*, CScriptDictionary*). No private server source or usable DWARF; mapped by 5.15 ELF symbols and cross-platform instructions. Linux begin/end take hidden result first, dictionary second; callee ret 4 consumes only the hidden pointer. Explicit __usercall argument locations retain this order; actual ret instruction remains authoritative. Iterator is {node,dictionary}, 8 bytes. The compiler reuses storage for std::string type_name then CString value; union is an analysis view, not a runtime API type.
