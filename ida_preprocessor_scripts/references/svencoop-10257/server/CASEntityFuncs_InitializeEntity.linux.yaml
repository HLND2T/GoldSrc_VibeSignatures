          const SvenStringView *classname,
          SvenEntityView *entity,
          const SvenDictionaryView *keyvalues)
  {
    SvenEntVarsView *vars; // edx
    CASManagerTypeQueryView *manager; // edx
    void *logger; // eax
    void *errorLogger; // edi
    void *newLogger; // [esp+10h] [ebp-88h]
    void *edict; // [esp+1Ch] [ebp-7Ch]
