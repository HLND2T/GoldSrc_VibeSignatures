          {
            kv.key = CScriptDictionary__CIterator__GetKey(&iterator)->data;
            kv.value = typeNameOrValue.value.data;
            kv.handled = 0;
            DispatchKeyValue(edict, &kv);
          }
          else
          {
            data = CScriptDictionary__CIterator__GetKey(&iterator)->data;
            logger = CASLog_pInstance;
            if ( !CASLog_pInstance )
            {
              newLogger = (void *)operator new(4u);
              CASLog::CASLog(newLogger);
              logger = newLogger;
              CASLog_pInstance = newLogger;
            }
            CASLog__Warning(
              logger,
              0,
              "CASEntityFuncs::CreateCustomEntity: failed to retrieve value for key '%s' from dictionary!\n",
              data);
          }
          CScriptDictionary_CIterator_operator_PP(&iterator);
        }
        CString::dtor((CStringReference *)&typeNameOrValue);
      }
      return 1;
    }
    errorLogger = CASLog_pInstance;
    if ( !CASLog_pInstance )
    {
      errorLogger = (void *)operator new(4u);
      CASLog::CASLog(errorLogger);
      CASLog_pInstance = errorLogger;
    }
    CASLog::Error(errorLogger, 0, "CASEntityFuncs::CreateCustomEntity: failed to get string type!\n");
    return 0;
  }
