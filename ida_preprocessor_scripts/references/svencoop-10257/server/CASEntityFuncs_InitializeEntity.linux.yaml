    int stringTypeId; // [esp+24h] [ebp-74h]
    asITypeInfo *stringTypeInfo; // [esp+2Ch] [ebp-6Ch]
    CASManagerTypeQueryView *other; // [esp+2Ch] [ebp-6Ch]
    SvenDictionaryIteratorView iterator; // [esp+3Ch] [ebp-5Ch] BYREF
    SvenDictionaryIteratorView endIterator; // [esp+44h] [ebp-54h] BYREF
    SvenKeyValueData kv; // [esp+4Ch] [ebp-4Ch] BYREF
    SvenTypeNameOrValue typeNameOrValue; // [esp+5Ch] [ebp-3Ch] BYREF

    if ( !entity )
      return 0;
    vars = entity->vars;
    if ( vars )
      edict = vars->edict;
    else
      edict = nullptr;
    kv.class_name = classname->data;
    kv.key = "classname";
    kv.value = kv.class_name;
    kv.handled = 0;
    DispatchKeyValue(edict, &kv);
    if ( !keyvalues )
      return 1;
    typeNameOrValue.type_name.data = typeNameOrValue.type_name.storage.local;
    strcpy(typeNameOrValue.type_name.storage.local, "string");
    typeNameOrValue.type_name.length = 6;
    manager = CASServerManager_pInstance;
    if ( !CASServerManager_pInstance )
    {
      other = (CASManagerTypeQueryView *)operator new(0x54u);
      CASServerManager__Constructor(other);
      manager = other;
      CASServerManager_pInstance = other;
    }
    stringTypeInfo = CASBaseManager__GetTypeInfoByName(manager, &typeNameOrValue.type_name);
    if ( (unsigned __int8 *)typeNameOrValue.type_name.data != &typeNameOrValue.value.padding[8] )
      operator delete(typeNameOrValue.type_name.data);
    if ( stringTypeInfo )
    {
      if ( !CScriptDictionary__IsEmpty(keyvalues) )
      {
        CString__Constructor((SvenStringView *)&typeNameOrValue);
        stringTypeId = (*(int (__cdecl **)(asITypeInfo *))(*(_DWORD *)stringTypeInfo + 48))(stringTypeInfo);
        CScriptDictionary__begin(&iterator, keyvalues);
        while ( 1 )
        {
          CScriptDictionary__end(&endIterator, keyvalues);
          if ( !CScriptDictionary__CIterator__operator_NE(&iterator, &endIterator) )
            break;
