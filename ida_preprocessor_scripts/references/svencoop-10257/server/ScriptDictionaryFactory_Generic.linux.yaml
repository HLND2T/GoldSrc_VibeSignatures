procedure: |-
  // SDK generic factory: engine from GetEngine, store dictionary in GetAddressOfReturnLocation. Windows inlines allocation/construction; Linux calls the independent engine-taking Create. This wrapper is not CScriptDictionary::Create.
  void __cdecl ScriptDictionaryFactory_Generic(asIScriptGeneric *generic)
  {
    CScriptDictionary **returnLocation; // esi
    asIScriptEngine *engine; // eax

    returnLocation = (CScriptDictionary **)generic->vtable->GetAddressOfReturnLocation(generic);
    engine = (asIScriptEngine *)generic->vtable->GetEngine(generic);
    *returnLocation = CScriptDictionary_Create(engine); // found_call CScriptDictionary_Create: allocate dictionary for this engine, then publish the returned object
  }
