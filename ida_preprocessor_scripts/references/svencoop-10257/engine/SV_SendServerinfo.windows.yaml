  // Sven Coop 10257 SV_SendServerinfo. Reconstructed from Windows instructions with D:\HLND2T_official\engine\sv_main.c:1222 as semantic reference; version-specific behavior is preserved.
  void __cdecl SV_SendServerinfo(sizebuf_t *msg, client_t *client)
  {
    client_t *clientState; // ebx
    signed __int32 spawncount; // ebx
    int build; // esi
    const char *serverBanner; // eax
    int playernum; // esi
    BOOL gameType; // eax
    const char *hostname; // eax
    char *mapcyclelist; // esi
    delta_info_t *p; // edi
    signed int fieldCount; // ebx
    int i; // esi
    int viewEntityIndex; // eax
    signed __int32 len; // [esp+4h] [ebp-84Ch] BYREF
    struct delta_description_t nulldesc; // [esp+8h] [ebp-848h] BYREF
    char message[2048]; // [esp+4Ch] [ebp-804h] BYREF
    clientState = client;
    if ( 0.0 != developer_value || svs_maxclients > 1 )
    {
      MSG_WriteByte(msg, 8);
      spawncount = svs_spawncount;
      build = build_number();
      serverBanner = (const char *)dword_95D22B0();
      snprintf_0(
        message,
        0x800u,
        "\n%s\nServer Engine: %s (build %d%s)\nServer Number: %i\n\n",
        serverBanner,
        "5.0.1.8",
        build,
        (const char *)&Locale,
        spawncount);
      MSG_WriteString(msg, message);
      clientState = client;
    }
    MSG_WriteByte(msg, 11);
    MSG_WriteLong(msg, 48);
    MSG_WriteLong(msg, svs_spawncount);
    playernum = NUM_FOR_EDICT(clientState->edict) - 1;
    MSG_WriteLong(msg, sv_worldmapCRC);
    MSG_WriteBuf(msg, 16, sv_clientdllmd5);
    MSG_WriteByte(msg, svs_maxclients);
    MSG_WriteByte(msg, playernum);
    gameType = 0.0 == coop_value && deathmatch_value != 0.0;
    MSG_WriteByte(msg, gameType);
    COM_FileBase(com_gamedir, message);
    MSG_WriteString(msg, message);
    hostname = Cvar_VariableString("hostname");
    MSG_WriteString(msg, hostname);
    MSG_WriteString(msg, sv_modelname);
    mapcyclelist = (char *)COM_LoadFileForMe(mapcyclefile_string, &len);
    if ( mapcyclelist && len )
    {
      if ( len > 8190 )
        mapcyclelist[8190] = 0;
      MSG_WriteString(msg, mapcyclelist);
      COM_FreeFile(mapcyclelist);
    }
    else
    {
      MSG_WriteString(msg, "mapcycle failure");
    }
    MSG_WriteByte(msg, 0);
    MSG_WriteByte(msg, 54);
    MSG_WriteString(msg, com_clientfallback);
    MSG_WriteByte(msg, sv_cheats);
    Q_memset(&nulldesc, 0, 0x44u);
    p = g_sv_delta;
    if ( g_sv_delta )
    {
      do
      {
        MSG_WriteByte(msg, 14);
        MSG_WriteString(msg, p->name);
        fieldCount = p->delta->fieldCount;
        MSG_StartBitWriting(msg);
        MSG_WriteBits(fieldCount, 16);
        if ( fieldCount > 0 )
        {
          i = 0;
          do
          {
            DELTA_WriteDelta((byte *)&nulldesc, (byte *)&p->delta->pdd[i++], 1, &g_MetaDelta, nullptr);
            --fieldCount;
          }
          while ( fieldCount );
        }
        MSG_EndBitWriting(msg);
        p = p->next;
      }
      while ( p );
      clientState = client;
    }
    SV_SetMoveVars();
    SV_WriteMovevarsToClient(msg);
    MSG_WriteByte(msg, 32);
    MSG_WriteByte(msg, gGlobalVariables_cdAudioTrack);
    MSG_WriteByte(msg, gGlobalVariables_cdAudioTrack);
    MSG_WriteByte(msg, 5);
    viewEntityIndex = NUM_FOR_EDICT(clientState->edict);
    MSG_WriteShort(msg, viewEntityIndex);
    clientState->spawned = 0;
    clientState->connected = 1;
    clientState->fully_connected = 0;
  }
