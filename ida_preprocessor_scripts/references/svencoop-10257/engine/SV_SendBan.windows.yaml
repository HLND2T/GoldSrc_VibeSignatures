    Q_snprintf_ServerExtraInfo(Buffer, 0x40u, "You have been banned from this server.\n");
    SZ_Clear(&net_message);
    MSG_WriteLong(&net_message, -1);
    MSG_WriteByte(&net_message, 108);
    MSG_WriteString(&net_message, Buffer);
    qmemcpy(&v0, &net_from, sizeof(v0));
    NET_SendPacket(1, net_message.cursize, net_message.data, v0); // (structmember, struct=rcon_sizebuf_t, member=data) // (structmember, struct=rcon_sizebuf_t, member=cursize)
