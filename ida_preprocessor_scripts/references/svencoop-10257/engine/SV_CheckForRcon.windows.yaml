procedure: |-
  // sv is the whole server object, independently checked against its current Host_ClearMemory zero-fill base. sv_active_offset is the active guard address minus that base (reference: 0, width 4); derive the target numeric offset and do not publish sv.active as a global. giActive is the int32 engine state compared with DLL_CLOSE=3, independently checked in Host_Init. cls.state and host_initialized are separate guards. Keep all existing receive/filter annotations.
  // Issue #326 Part B reference: verified current input, cdecl ABI and current call/dataflow. Native menu poller retains its dedicated/state guards. Inline filter/parser and authentication/redirect blocks are actual target code; separate retained helpers may be uncalled. Sven netadr trailing bytes are opaque; extra address-format/comparison arguments are target-specific.
  void __cdecl SV_CheckForRcon()
  {
    char *StringLine; // eax
    char *v1; // esi

    if ( !sv.active && !dword_20D7D70 && giActive != 3 && host_initialized && NET_GetPacket(1) ) // (structmember, struct=rcon_server_prefix_t, member=active)
    {
      do
      {
        if ( SV_FilterPacket() )
        {
          SV_SendBan();
        }
        else if ( *(_DWORD *)net_message.data == -1 ) // (structmember, struct=rcon_sizebuf_t, member=data)
        {
          MSG_BeginReading();
          MSG_ReadLong();
          StringLine = MSG_ReadStringLine();
          Cmd_TokenizeString(StringLine);
          v1 = (char *)Cmd_Argv(0);
          if ( Q_strcmp(v1, "getchallenge") )
          {
            if ( Q_stricmp(v1, "challenge") )
            {
              if ( !Q_strcmp(v1, "rcon") )
                SV_Rcon(&net_from);
            }
            else
            {
              SVC_ServiceChallenge();
            }
          }
          else
          {
            SVC_GetChallenge();
          }
        }
      }
      while ( NET_GetPacket(1) );
    }
  }
