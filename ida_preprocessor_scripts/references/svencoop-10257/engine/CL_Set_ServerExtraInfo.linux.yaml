  // Source role: engine/cl_parsefn.c CL_Set_ServerExtraInfo. Sven binary checked against source semantics; source revision is not assumed identical.
  void __cdecl CL_Set_ServerExtraInfo()
  {
    char *dir; // edi
    char val[32]; // [esp+10h] [ebp-2Ch] BYREF

    dir = MSG_ReadString();
    allow_cheats = MSG_ReadByte();
