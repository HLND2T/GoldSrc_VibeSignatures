disasm_code: |-
  ; s_bEnforceAspect receives COM_CheckParm("-stretchaspect")==0; it is global, unlike the startup-screen local with the same source name.
  ; bDoMSAAFBO is disabled by -nomsaa and guards multisample renderbuffer creation. AA mode count/index are separate globals.
  ; bDoScaledFBO is disabled by -nofbo or missing FBO/rectangle-texture support and guards the scaled backbuffer.
  ; s_bSupportsBlitTexturing is set by GL_EXT_framebuffer_multisample_blit_scaled support and overridden by -directblit / -nodirectblit.
  ; s_MSAAFBO is the complete four-GLuint container whose framebuffer has MULTISAMPLE renderbuffer attachments. Select its base address passed to GenFramebuffersEXT.
  ; s_BackBufferFBO is the complete four-GLuint container whose framebuffer has a RECTANGLE TEXTURE attachment. Select its base address passed to GenFramebuffersEXT.
  ; The first field s_hBackBufferFBO is at the container base. CB, DB and Tex are interior members, not independent targets. Linux PIC/GOT operands must resolve to the object, not the GOT slot.
