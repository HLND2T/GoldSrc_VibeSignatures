procedure: |-
  void *__cdecl Mod_LoadSpriteFrame(msprite_t *psprite, void *pin, mspriteframe_t **ppframe, int framenum)
  {
    int width; // ebp
    mspriteframe_t *pspriteframe; // edi
    int origin1; // eax
    int textureType; // eax
    int textureClass; // ecx
    qboolean mipmap; // edx
    int height; // [esp+10h] [ebp-414h]
    int origin0; // [esp+18h] [ebp-40Ch]
    char name[256]; // [esp+20h] [ebp-404h] BYREF
    byte bPal[768]; // [esp+120h] [ebp-304h] BYREF

    Q_memcpy(bPal, pspritepal, 0x300u);
    width = LittleLong(*((_DWORD *)pin + 2));
    height = LittleLong(*((_DWORD *)pin + 3));
    pspriteframe = (mspriteframe_t *)Hunk_AllocName(28, loadname);
    Q_memset(pspriteframe, 0, 0x1Cu);
    *ppframe = pspriteframe;
    pspriteframe->width = width;
    pspriteframe->height = height;
    origin0 = LittleLong(*(_DWORD *)pin);
    origin1 = LittleLong(*((_DWORD *)pin + 1));
    pspriteframe->up = (float)origin1;
    pspriteframe->down = (float)(origin1 - height);
    pspriteframe->left = (float)origin0;
    pspriteframe->right = (float)(origin0 + width);
    sub_1D0A300(name, "%s_%i", (char)loadmodel);
    switch ( psprite->type )
    {
      case 0:
      case 1:
        textureType = 0;
        break;
      case 2:
        textureType = 2;
        break;
      case 3:
        textureType = 1;
        break;
      default:
        textureType = width * height;
        break;
    }
    if ( gSpriteMipMap ) // gSpriteMipMap: select this direct global comparison for found_gv
    {
      textureClass = 5;
      mipmap = 1;
    }
    else
    {
      textureClass = 2;
      mipmap = 0;
    }
    pspriteframe->gl_texturenum = GL_LoadTexture(
                                    name,
                                    textureClass,
                                    width,
                                    height,
                                    (byte *)pin + 16,
                                    mipmap,
                                    textureType,
                                    bPal);
    return (char *)pin + width * height + 16;
  }
