  void *__cdecl Mod_LoadSpriteFrame(msprite_t *psprite, void *pin, mspriteframe_t **ppframe, int framenum)
  {
    mspriteframe_t *pspriteframe; // ebp
    int origin1; // eax
    int type; // eax
    int textureType; // eax
    int width; // [esp+28h] [ebp-434h]
    int height; // [esp+2Ch] [ebp-430h]
    int origin0; // [esp+34h] [ebp-428h]
    char name[256]; // [esp+40h] [ebp-41Ch] BYREF
    unsigned __int16 bPal[398]; // [esp+140h] [ebp-31Ch] BYREF

    Q_memcpy(bPal, pspritepal, 0x300u);
    width = LittleLong(*((_DWORD *)pin + 2));
    height = LittleLong(*((_DWORD *)pin + 3));
    pspriteframe = (mspriteframe_t *)Hunk_AllocName(28, loadname);
    Q_memset(pspriteframe, 0, 0x1Cu);
    *ppframe = pspriteframe;
    pspriteframe->width = width;
    pspriteframe->height = height;
    origin0 = LittleLong(*(_DWORD *)pin);
    origin1 = LittleLong(*((_DWORD *)pin + 1));
    pspriteframe->up = (float)origin1;
    pspriteframe->down = (float)(origin1 - height);
    pspriteframe->left = (float)origin0;
    pspriteframe->right = (float)(width + origin0);
    sprintf(name, "%s_%i", loadmodel, framenum);
    type = psprite->type;
    if ( type == 2 )
      textureType = 2;
    else
      textureType = type > 2 && type == 3;
    if ( gSpriteMipMap ) // gSpriteMipMap: select the condition backed by this direct PIC global read for found_gv
      pspriteframe->gl_texturenum = GL_LoadTexture(
                                      name,
                                      (int)&byte_5,
                                      width,
                                      height,
                                      (byte *)pin + 16,
                                      1,
                                      textureType,
                                      (byte *)bPal);
    else
      pspriteframe->gl_texturenum = GL_LoadTexture(
                                      name,
                                      (int)&dword_0 + 2,
                                      width,
                                      height,
                                      (byte *)pin + 16,
                                      0,
                                      textureType,
                                      (byte *)bPal);
    return (char *)pin + height * width + 16;
  }
