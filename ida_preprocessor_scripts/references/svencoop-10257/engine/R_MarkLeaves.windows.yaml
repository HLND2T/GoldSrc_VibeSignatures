procedure: |-
  // Targets are the two pointer globals themselves, not the pointed-to leaves or ELF GOT slots.
  // Current-binary leaf/PVS marking. Source gl_rsurf.c is semantic evidence, not an exact build. SvEngine omits the GoldSrc mirror early return.
  void __cdecl R_MarkLeaves()
  {
    double novis_value; // st7
    char *worldmodel; // edi
    int i; // ebx
    int visframe; // esi
    int leaf_byte_offset; // ebp
    int node; // eax
    unsigned __int8 *vis; // [esp+0h] [ebp-1008h]
    _BYTE solid[4096]; // [esp+4h] [ebp-1004h] BYREF

    novis_value = r_novis_value;
    if ( r_oldviewleaf != r_viewleaf || 0.0 != novis_value )
    {
      ++r_visframecount;
      r_oldviewleaf = r_viewleaf;
      if ( 0.0 == novis_value )
      {
        vis = Mod_LeafPVS(r_viewleaf, cl_worldmodel);
      }
      else
      {
        vis = solid;
        Q_memset(solid, 255, (*((_DWORD *)cl_worldmodel + 34) + 7) >> 3);
      }
      worldmodel = cl_worldmodel;
      i = 0;
      if ( *((int *)cl_worldmodel + 34) > 0 )
      {
        visframe = r_visframecount;
        leaf_byte_offset = 0;
        do
        {
          if ( ((unsigned __int8)(1 << (i & 7)) & vis[i >> 3]) != 0 )
          {
            node = leaf_byte_offset + *((_DWORD *)worldmodel + 35) + 60;
            do
            {
              if ( *(_DWORD *)(node + 4) == visframe )
                break;
              *(_DWORD *)(node + 4) = visframe;
              node = *(_DWORD *)(node + 32);
              visframe = r_visframecount;
            }
            while ( node );
            worldmodel = cl_worldmodel;
          }
          ++i;
          leaf_byte_offset += 60;
        }
        while ( i < *((_DWORD *)worldmodel + 34) );
      }
    }
  }
