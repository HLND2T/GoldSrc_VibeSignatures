procedure: |-
  int __cdecl ModelFrames(int modelIndex)
  {
    if ( (unsigned int)(modelIndex - 1) > 0x1FFE )
    {
      Con_DPrintf("Bad sprite index!\n");
      return 1;
    }
    else
    {
      _mm_lfence();
      return Mod_FrameCount(sv_models[modelIndex]);
    }
  }
