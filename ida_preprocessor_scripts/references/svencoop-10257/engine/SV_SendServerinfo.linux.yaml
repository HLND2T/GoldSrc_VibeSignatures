          to = &currentDelta->delta->pdd[fieldIndex++];
          DELTA_WriteDelta((byte *)&nulldesc, (byte *)to, 1, &g_MetaDelta, nullptr);
        }
        while ( buffer != fieldsWritten );
        p = currentDelta;
      }
      MSG_EndBitWriting(msg);
    }
    SV_SetMoveVars();                             // inlined SV_WriteDeltaDescriptionsToClient: end; SV_SetMoveVars resumes SV_SendServerinfo
    SV_WriteMovevarsToClient(msg);
    MSG_WriteByte(msg, svc_cdtrack);
    MSG_WriteByte(msg, gGlobalVariables_cdAudioTrack);
    MSG_WriteByte(msg, gGlobalVariables_cdAudioTrack);
    MSG_WriteByte(msg, svc_setview);
    viewEntityIndex = NUM_FOR_EDICT(client->edict);
    MSG_WriteShort(msg, viewEntityIndex);
    client->spawned = 0;
    client->connected = 1;
    client->fully_connected = 0;
  }
