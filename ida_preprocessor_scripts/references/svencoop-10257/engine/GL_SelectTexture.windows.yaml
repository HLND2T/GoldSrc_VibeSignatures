  // gl_mtexable gates texture-unit selection; oldtarget is the previous unit compared with target and updated after caching bindings.
  void __cdecl GL_SelectTexture(unsigned int target)
  {
    if ( gl_mtexable )
    {
      _glewActiveTextureARB(target);
      if ( target != oldtarget )
      {
        *(_DWORD *)&aInsertelementa_14[4 * oldtarget] = currenttexture;
        currenttexture = *(_DWORD *)&aInsertelementa_14[4 * target];
        oldtarget = target;
      }
    }
  }
