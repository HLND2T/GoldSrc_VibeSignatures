procedure: |-
  void __thiscall vgui2_RichText_InsertString_Unicode(RichTextReference *self, const unsigned __int16 *wszText)
  {
    const unsigned __int16 *ch; // esi
    unsigned __int16 wch; // ax
    RichTextReferenceVtable *vptr; // edx

    ch = wszText;
    for ( wch = *wszText; wch; ++ch )
    {
      GameUI_RichText_InsertChar(self, wch); // vgui2::RichText::InsertChar(wchar_t), not the string overload
      wch = ch[1];
    }
    self->vptr->InvalidateLayout(self, 0, 0);
    vptr = self->vptr;
    self->m_bRecalcLineBreaks = 1;
    vptr->Repaint(self);
  }
