  // vid_d3d_value names the writable float value member of the cvar whose name is "vid_d3d" and initial string is "0". It is not the cvar_t object base.
  // The fD3D branch sets this float to 1.0f and selects QGL_D3DInit; distinguish the separate integer driver flag. Select the member STORE itself, not the cvar-registration argument.
