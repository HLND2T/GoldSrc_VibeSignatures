  int __cdecl GL_SetMode(
          void *mainwindow,
          void **pmaindc,
          void **pbaseRC,
          int fD3D,
          const char *pszDriver,
          const char *pszCmdLine)
  {
    int v6; // eax
    HMODULE v7; // ebp
    HDC DC; // eax
