procedure: |-
  // Restored from official engine/sv_main.c and hw.so DWARF; SV_WriteDeltaDescriptionsToClient is compiler-inlined in this build.
  void __cdecl SV_SendServerinfo(sizebuf_t *msg, client_t *client)
  {
    int buildnum; // eax
    int edictnum; // eax
    int playernum; // esi
    BOOL is_deathmatch; // eax
    char *hostname; // eax
    char *mapcyclelist; // esi
    delta_info_t *p; // ebx
    signed int c; // edi
    int i; // esi
    int viewEntity; // eax
    int spawncount; // [esp-10h] [ebp-868h]
    int len; // [esp+8h] [ebp-850h] BYREF
    int mungebuffer; // [esp+Ch] [ebp-84Ch] BYREF
    struct delta_description_t nulldesc; // [esp+10h] [ebp-848h] BYREF
    char message[2048]; // [esp+54h] [ebp-804h] BYREF
    if ( developer.value != 0.0 || svs.maxclients > 1 )
    {
      MSG_WriteByte(msg, svc_print);
      spawncount = svs.spawncount;
      buildnum = build_number();
      Q_snprintf(message, 0x800u, "%c\nBUILD %d SERVER (%i CRC)\nServer # %i\n", 2, buildnum, 0, spawncount);
      MSG_WriteString(msg, message);
    }
    MSG_WriteByte(msg, svc_serverinfo);
    MSG_WriteLong(msg, PROTOCOL_VERSION);
    MSG_WriteLong(msg, svs.spawncount);
    edictnum = NUM_FOR_EDICT(client->edict);
    mungebuffer = sv.worldmapCRC;
    playernum = edictnum - 1;
    COM_Munge3((unsigned __int8 *)&mungebuffer, 4, (unsigned __int8)(-1 - (edictnum - 1)));
    MSG_WriteLong(msg, mungebuffer);              // To prevent cheating with hacked maps
    MSG_WriteBuf(msg, 16, sv.clientdllmd5);       // To prevent cheating with hacked client DLLs
    MSG_WriteByte(msg, svs.maxclients);
    MSG_WriteByte(msg, playernum);
    is_deathmatch = coop.value == 0.0 && deathmatch.value != 0.0;
    MSG_WriteByte(msg, is_deathmatch);
    COM_FileBase(com_gamedir, message);
    MSG_WriteString(msg, message);
    hostname = Cvar_VariableString("hostname");
    MSG_WriteString(msg, hostname);
    MSG_WriteString(msg, sv.modelname);
    mapcyclelist = (char *)COM_LoadFileForMe(mapcyclefile.string, &len);
    if ( mapcyclelist && len )
    {
      if ( len > 0x2000 )
      {
        len = 0x2000;
        mapcyclelist[0x1FFF] = 0;
      }
      MSG_WriteString(msg, mapcyclelist);
      COM_FreeFile(mapcyclelist);
    }
    else
    {
      MSG_WriteString(msg, "mapcycle failure");
    }
    MSG_WriteByte(msg, 0);
    MSG_WriteByte(msg, svc_sendextrainfo);
    MSG_WriteString(msg, com_clientfallback);
    MSG_WriteByte(msg, allow_cheats != 0.0);
    Q_memset(&nulldesc, 0, 68);                   // Begin inlined SV_WriteDeltaDescriptionsToClient
    for ( p = g_sv_delta; p; p = p->next )
    {
      MSG_WriteByte(msg, svc_deltadescription);
      MSG_WriteString(msg, p->name);
      c = p->delta->fieldCount;
      MSG_StartBitWriting(msg);
      MSG_WriteBits(c, 16);
      if ( c > 0 )
      {
        i = 0;
        do
        {
          DELTA_WriteDelta((unsigned __int8 *)&nulldesc, (unsigned __int8 *)&p->delta->pdd[i++], 1, &g_MetaDelta, nullptr);
          --c;
        }
        while ( c );
      }
      MSG_EndBitWriting(msg);
    }
    SV_SetMoveVars();                             // End inlined SV_WriteDeltaDescriptionsToClient
    SV_WriteMovevarsToClient(msg);
    MSG_WriteByte(msg, svc_cdtrack);
    MSG_WriteByte(msg, gGlobalVariables.cdAudioTrack);
    MSG_WriteByte(msg, gGlobalVariables.cdAudioTrack);
    MSG_WriteByte(msg, svc_setview);
    viewEntity = NUM_FOR_EDICT(client->edict);
    MSG_WriteShort(msg, viewEntity);
    client->spawned = 0;
    client->connected = 1;
    client->fully_connected = 0;
  }
